<script>
// ==================== 音效引擎 ====================
class Audio {
  constructor() {
    this.on = true;
    this.ctx = null;
    this.master = null;
    this.bgmGain = null;
    this._unlocked = false;
    this._bgmNodes = [];
    this._bgmTimer = null;
    this._boot();
  }
  _boot() {
    const doUnlock = () => {
      if (this._unlocked) return;
      this._unlocked = true;
      try {
        this.ctx = new (window.AudioContext||window.webkitAudioContext)();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.5;
        this.master.connect(this.ctx.destination);
        this.bgmGain = this.ctx.createGain();
        this.bgmGain.gain.value = 0.06;
        this.bgmGain.connect(this.master);
        console.log('AudioContext 已解锁');
      } catch(e) { this.on = false; console.warn('AudioContext 创建失败:', e); }
    };
    if (typeof WeixinJSBridge !== 'undefined') {
      try { WeixinJSBridge.invoke('getNetworkType', {}, () => doUnlock()); } catch(e) {}
    }
    document.addEventListener('WeixinJSBridgeReady', () => {
      try { WeixinJSBridge.invoke('getNetworkType', {}, () => doUnlock()); } catch(e) {}
    }, {once:true});
    ['touchstart','mousedown','click'].forEach(evt => {
      document.addEventListener(evt, () => {
        if (!this._unlocked) doUnlock();
      }, {once:true, passive:true});
    });
    setTimeout(() => { if (!this._unlocked) doUnlock(); }, 1000);
  }
  t() { return this.ctx ? this.ctx.currentTime : 0; }

  play(k) {
    if (!this.on || !this.ctx) return;
    const t = this.t();
    const m = this.master;
    const noise = (dur, fLo, fHi, q, vol) => {
      const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * dur, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1)*Math.exp(-i/(this.ctx.sampleRate*0.015));
      const s = this.ctx.createBufferSource(); s.buffer = buf;
      const flt = this.ctx.createBiquadFilter();
      if (fLo && fHi) { flt.type='bandpass'; flt.frequency.value=(fLo+fHi)/2; flt.Q.value=q||3; }
      else { flt.type='lowpass'; flt.frequency.value=fLo||800; }
      const g = this.ctx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
      s.connect(flt); flt.connect(g); g.connect(m);
      s.start(t); s.stop(t+dur);
    };
    const tone = (f, dur, vol, type, freqEnd) => {
      const o = this.ctx.createOscillator(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
      if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd,t+dur);
      const g = this.ctx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
      o.connect(g); g.connect(m); o.start(t); o.stop(t+dur);
    };

    switch(k) {
      case 'unscrew':
        noise(0.1, 2500, 4500, 5, 0.07);
        for(let i=0;i<3;i++) tone(2200+i*150, 0.03, 0.05, 'sine');
        break;
      case 'boxIn':
        tone(750, 0.07, 0.09, 'triangle', 380);
        break;
      case 'boxFull':
        [523,659,784].forEach((f,i) => {
          setTimeout(() => tone(f, 0.28, 0.07, 'sine'), i*80);
        });
        break;
      case 'panelDrop':
        tone(180, 0.28, 0.12, 'sine', 50);
        noise(0.15, 300, 1000, 2, 0.06);
        break;
      case 'panelWobble':
        tone(110, 0.25, 0.05, 'sine');
        break;
      case 'win':
        [523,659,784,1047,784,1047].forEach((f,i) => {
          setTimeout(() => tone(f, 0.35, 0.09, 'sine'), i*95);
        });
        break;
      case 'lose':
        tone(180, 0.3, 0.07, 'square', 110);
        break;
      case 'hint':
        [700,900].forEach((f,i) => setTimeout(() => tone(f, 0.2, 0.05, 'sine'), i*100));
        break;
      case 'click':
        tone(1100, 0.025, 0.03, 'sine');
        break;
      case 'autoMatch':
        tone(650, 0.12, 0.06, 'triangle', 400);
        break;
    }
  }

  bgm() {
    if (!this.on || !this.ctx) return;
    this._bgmLoop();
  }
  _bgmLoop() {
    if (!this.on) return;
    const ctx = this.ctx, t = this.t(), mg = this.bgmGain;
    // Lo-fi 解压 BGM：bass + pads + soft beats
    // 和弦进行：Am - F - C - G (A3=220, F3=174.6, C3=130.8, G2=98)
    const chords = [
      [220, 261.6, 329.6], // Am
      [174.6, 220, 261.6], // F
      [261.6, 329.6, 392],  // C
      [196, 246.9, 329.6],  // G
    ];
    const bassNotes = [110, 87.3, 130.8, 98]; // 低八度
    const beatLen = 1.8; // 每和弦1.8秒

    chords.forEach((ch, ci) => {
      const start = t + ci * beatLen;
      // Bass — 柔和的低音底
      const bo = ctx.createOscillator(); bo.type = 'triangle';
      bo.frequency.setValueAtTime(bassNotes[ci], start);
      const bg = ctx.createGain();
      bg.gain.setValueAtTime(0, start);
      bg.gain.linearRampToValueAtTime(0.07, start + 0.04);
      bg.gain.setValueAtTime(0.07, start + beatLen * 0.6);
      bg.gain.exponentialRampToValueAtTime(0.001, start + beatLen * 0.9);
      bo.connect(bg); bg.connect(mg);
      bo.start(start); bo.stop(start + beatLen);
      this._bgmNodes.push(bo);

      // Pad — 和弦铺底
      ch.forEach((f, fi) => {
        const po = ctx.createOscillator(); po.type = 'sine';
        po.frequency.setValueAtTime(f, start);
        const pg = ctx.createGain();
        pg.gain.setValueAtTime(0, start + fi * 0.06);
        pg.gain.linearRampToValueAtTime(0.025, start + fi * 0.06 + 0.08);
        pg.gain.exponentialRampToValueAtTime(0.001, start + beatLen * 0.85);
        po.connect(pg); pg.connect(mg);
        po.start(start + fi * 0.06); po.stop(start + beatLen);
        this._bgmNodes.push(po);
      });

      // Soft hi-hat — 沙沙声
      for (let i = 0; i < 4; i++) {
        const ht = start + i * (beatLen / 4);
        const buf = ctx.createBuffer(1, ctx.sampleRate * 0.04, ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let j = 0; j < d.length; j++) d[j] = (Math.random()*2-1) * Math.exp(-j/(ctx.sampleRate*0.008));
        const hs = ctx.createBufferSource(); hs.buffer = buf;
        const hf = ctx.createBiquadFilter(); hf.type = 'highpass'; hf.frequency.value = 6000;
        const hg = ctx.createGain(); hg.gain.setValueAtTime(0.02, ht); hg.gain.exponentialRampToValueAtTime(0.001, ht + 0.04);
        hs.connect(hf); hf.connect(hg); hg.connect(mg);
        hs.start(ht); hs.stop(ht + 0.04);
        this._bgmNodes.push(hs);
      }

      // 轻拍 — 木鱼感
      if (ci % 2 === 0) {
        const kt = start + beatLen * 0.02;
        tone(300, 0.08, 0.02, 'sine');
      }
    });

    this._bgmTimer = setTimeout(() => this._bgmLoop(), chords.length * beatLen * 1000);
  }
  stopBGM() {
    clearTimeout(this._bgmTimer);
    this._bgmNodes.forEach(n => { try{n.stop()}catch(e){} });
    this._bgmNodes = [];
  }
}

// ==================== 关卡生成器 ====================
const COLS = [
  {n:'red',    f:'#e94560', g:'#ff6b6b', d:'#a71d3a'},
  {n:'blue',   f:'#4d96ff', g:'#6db3ff', d:'#1a56b8'},
  {n:'green',  f:'#2ecc71', g:'#58d68d', d:'#1a7a3a'},
  {n:'yellow', f:'#f1c40f', g:'#f9e154', d:'#b8960a'},
  {n:'purple', f:'#9b59b6', g:'#bb8fce', d:'#6c3483'},
  {n:'orange', f:'#e67e22', g:'#f0a04b', d:'#a05517'},
];

// 木板配色 — 多种木纹色调
const WOODS = [
  {base:'#e8d5b7', dark:'#c4a882', light:'#f5ede0', name:'浅橡木'},
  {base:'#d4c0a0', dark:'#b89a7a', light:'#e8dcc8', name:'蜂蜜木'},
  {base:'#c9a882', dark:'#a07850', light:'#e0c8a8', name:'核桃木'},
  {base:'#bfa88a', dark:'#967855', light:'#d8c8b0', name:'柚木'},
  {base:'#dcc8a8', dark:'#b89870', light:'#f0e0c8', name:'枫木'},
  {base:'#b89578', dark:'#8c6a4a', light:'#d4b898', name:'樱桃木'},
  {base:'#e0c090', dark:'#b89860', light:'#f5e8c8', name:'松木'},
  {base:'#c8b8a0', dark:'#a09078', light:'#e0d8c8', name:'灰木'},
];

function genLevel(lv) {
  // 难度曲线：快速递增
  let numCol, cap, numPanel, tempMax;
  if (lv === 1) {
    numCol = 2; cap = 3; numPanel = 3; tempMax = 7;
  } else if (lv === 2) {
    numCol = 2; cap = 4; numPanel = 4; tempMax = 6;
  } else if (lv <= 3) {
    numCol = 3; cap = 3; numPanel = 5; tempMax = 6;
  } else if (lv <= 5) {
    numCol = 3; cap = 3; numPanel = Math.min(5 + (lv-3), 8); tempMax = 7;
  } else if (lv <= 8) {
    numCol = 4; cap = 3; numPanel = Math.min(6 + (lv-5), 9); tempMax = 7;
  } else if (lv <= 12) {
    numCol = 5; cap = 3; numPanel = Math.min(7 + (lv-8), 10); tempMax = 8;
  } else {
    numCol = 6; cap = 3; numPanel = Math.min(8 + Math.floor((lv-12)/3), 10); tempMax = 8;
  }

  const total = numCol * cap;
  const colors = COLS.slice(0, numCol);

  const GX=30, GY=130, GW=360, GH=340;

  // 反复生成直到可解
  let attempts = 0;
  while (attempts < 30) {
    attempts++;
    const result = _tryGen(lv, colors, cap, total, numPanel, tempMax, GX, GY, GW, GH);
    if (result && _isSolvable(result)) return result;
  }
  // 兜底：返回最后一次生成的（大概率可解）
  return _tryGen(lv, colors, cap, total, numPanel, tempMax, GX, GY, GW, GH);
}

function _tryGen(lv, colors, cap, total, numPanel, tempMax, GX, GY, GW, GH) {
  const screwCols = [];
  colors.forEach(c => { for(let i=0;i<cap;i++) screwCols.push(c); });
  shuffle(screwCols);

  const panels = [];
  for (let i = 0; i < numPanel; i++) {
    const pw = 70 + Math.random() * 80;
    const ph = 50 + Math.random() * 60;
    const cx = GX + 30 + Math.random() * (GW - 60);
    const cy = GY + 30 + Math.random() * (GH - 80);
    const wood = WOODS[i % WOODS.length];
    panels.push({ id:i, cx, cy, w:pw, h:ph, screws:[], dropped:false, wobble:false,
      wood: wood,
      layer: i
    });
  }

  panels.sort((a,b) => a.layer - b.layer);
  panels.forEach((p,i) => { p.layer = i; });

  // 每块木板至少1颗螺丝
  let si = 0;
  panels.forEach(p => {
    p.screws.push({
      id: si, color: screwCols[si],
      x: p.cx, y: p.cy, panelId: p.id, removed: false, animT: 0,
    });
    si++;
  });
  // 剩余螺丝随机分配
  while (si < total) {
    const p = panels[Math.floor(Math.random() * panels.length)];
    const cnt = p.screws.length;
    const offX = (cnt%2===0?-1:1) * p.w * 0.28;
    const offY = (cnt<2?-1:1) * p.h * 0.22;
    p.screws.push({
      id: si, color: screwCols[si],
      x: p.cx + offX, y: p.cy + offY, panelId: p.id, removed: false, animT: 0,
    });
    si++;
  }

  const allScrews = panels.flatMap(p => p.screws);

  const boxes = [];
  colors.forEach(c => { boxes.push(c); });
  shuffle(boxes);

  return {
    level: lv, colors, panels, screws: allScrews, boxes,
    cap, tempMax,
    activeBox: boxes.shift(),
    activeCount: 0,
    temp: [],
  };
}

// 贪心求解器：验证关卡可解
function _isSolvable(st) {
  // 深拷贝关键状态
  const screws = st.screws.map(s => ({...s, removed: false}));
  const panels = st.panels.map(p => ({
    ...p, dropped: false, screws: p.screws.map(s => ({...s, removed: false}))
  }));
  // 重新关联：panels 中的 screws 需要和 screws 数组共享引用
  // 简化做法：直接在 screws 上操作
  const temp = [];
  const tempMax = st.tempMax;
  let activeBox = {...st.activeBox};
  let activeCount = st.activeCount;
  const boxes = st.boxes.map(b => ({...b}));

  // 辅助：面板是否被遮挡
  const blocked = (screw) => {
    const p = panels.find(p => p.id === screw.panelId);
    if (!p || p.dropped) return false;
    for (const op of panels) {
      if (op.id === p.id || op.dropped) continue;
      if (op.layer > p.layer && _overlap(op, p)) return true;
    }
    return false;
  };

  // 贪心策略：优先移匹配的，否则移不匹配的到 temp
  let stuck = 0;
  while (screws.some(s => !s.removed) && stuck < screws.length * 3) {
    // 优先找匹配当前盒子且可访问的
    let found = null;
    for (const s of screws) {
      if (s.removed || blocked(s)) continue;
      if (activeBox && s.color.n === activeBox.n) { found = s; break; }
    }
    // 没有匹配的，随便找一个可访问的放 temp
    if (!found) {
      for (const s of screws) {
        if (s.removed || blocked(s)) continue;
        found = s; break;
      }
    }
    if (!found) { stuck++; continue; }

    found.removed = true;
    // 检查面板
    const panel = panels.find(p => p.id === found.panelId);
    if (panel && panel.screws.every(ps => {
      const s = screws.find(ss => ss.id === ps.id);
      return s ? s.removed : ps.removed;
    })) {
      panel.dropped = true;
    }

    if (activeBox && found.color.n === activeBox.n) {
      activeCount++;
      if (activeCount >= st.cap) {
        activeBox = boxes.length > 0 ? boxes.shift() : null;
        activeCount = 0;
        // 自动从 temp 匹配
        if (activeBox) {
          for (let i = temp.length-1; i >= 0; i--) {
            if (temp[i].color.n === activeBox.n) {
              temp.splice(i, 1);
              activeCount++;
              if (activeCount >= st.cap) {
                activeBox = boxes.length > 0 ? boxes.shift() : null;
                activeCount = 0;
                if (!activeBox) break;
              }
            }
          }
        }
      }
    } else {
      if (temp.length >= tempMax) return false; // temp 满了，不可解
      temp.push({ color: found.color });
      stuck = 0;
    }
  }

  return screws.every(s => s.removed);
}

function shuffle(a) {
  for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
}

function _overlap(a, b) {
  return !(a.cx-a.w/2 > b.cx+b.w/2 || a.cx+a.w/2 < b.cx-b.w/2 ||
           a.cy-a.h/2 > b.cy+b.h/2 || a.cy+a.h/2 < b.cy-b.h/2);
}

// ==================== 游戏 ====================
class Game {
  constructor() {
    this.cvs = document.getElementById('gc');
    this.ctx = this.cvs.getContext('2d');
    this.audio = new Audio();
    this.st = null;
    this._seed = null;
    this.ps = [];
    this.hist = [];
    this.hinted = null;
    this.paused = false;
    this.busy = false;
    this._autoClearing = false;
    this._size();
    window.addEventListener('resize', () => this._size());
    this.cvs.addEventListener('click', e => this._tap(e));
    this.cvs.addEventListener('touchstart', e => { e.preventDefault(); this._tap(e.touches[0]); }, {passive:false});
    this._loop();
  }

  _size() {
    const r = this.cvs.getBoundingClientRect();
    this.W = r.width; this.H = r.height;
    this.cvs.width = r.width * (devicePixelRatio||1);
    this.cvs.height = r.height * (devicePixelRatio||1);
    this.S = this.cvs.width / r.width;
  }

  _deepClone(obj) { return JSON.parse(JSON.stringify(obj)); }

  // ===== 关卡 =====
  start(lv) {
    this.st = genLevel(lv);
    this._seed = this._deepClone(this.st);
    this.ps = [];
    this.hist = [];
    this.hinted = null;
    this.busy = false;
    this.paused = false;
    this._autoClearing = false;
    this.shakeX = 0; this.shakeDur = 0; this.shakeStart = null;
    this.st.combo = 0; this.st.comboTime = 0; this.st.boxGlow = null;
    hideAll();
    document.getElementById('lv').textContent = `第 ${lv} 关`;
    this.audio.bgm();
  }

  next() {
    this._seed = null;
    this.start(this.st.level + 1);
  }

  restart() {
    if (this._seed) {
      this.st = this._deepClone(this._seed);
      this.ps = [];
      this.hist = [];
      this.hinted = null;
      this.busy = false;
      this.paused = false;
      this._autoClearing = false;
      this.shakeX = 0; this.shakeDur = 0; this.shakeStart = null;
      this.st.combo = 0; this.st.comboTime = 0; this.st.boxGlow = null;
      hideAll();
      document.getElementById('lv').textContent = `第 ${this.st.level} 关`;
      this.audio.bgm();
    } else {
      this.start(this.st.level);
    }
  }

  pause() {
    this.paused = true;
    document.getElementById('ovPause').classList.remove('hidden');
  }

  resume() {
    this.paused = false;
    document.getElementById('ovPause').classList.add('hidden');
  }

  sound() {
    this.audio.on = !this.audio.on;
    document.getElementById('btnSound').textContent = this.audio.on ? '🔊' : '🔇';
    if (!this.audio.on) this.audio.stopBGM(); else this.audio.bgm();
  }

  // ===== 核心 =====
  _tap(e) {
    if (this.paused || this.busy || !this.st || this._autoClearing) return;
    const mx = (e.clientX - this.cvs.getBoundingClientRect().left);
    const my = (e.clientY - this.cvs.getBoundingClientRect().top);

    const st = this.st;
    let best = null, bestD = Infinity;
    for (const s of st.screws) {
      if (s.removed) continue;
      const p = st.panels.find(p => p.id === s.panelId);
      if (p && !p.dropped && this._blocked(p)) continue;
      const dx = mx - s.x, dy = my - s.y;
      const d = dx*dx + dy*dy;
      if (d < 600 && d < bestD) { best = s; bestD = d; }
    }
    if (best) this._remove(best);
  }

  _blocked(panel) {
    for (const p of this.st.panels) {
      if (p.id === panel.id || p.dropped) continue;
      if (p.layer > panel.layer && _overlap(p, panel)) return true;
    }
    return false;
  }

  _remove(screw) {
    const st = this.st;
    this.busy = true;

    this.hist.push({
      sid: screw.id,
      box: st.activeBox ? {...st.activeBox} : null,
      cnt: st.activeCount,
      queue: [...st.boxes],
      temp: st.temp.map(t => ({...t})),
      panels: st.panels.map(p => ({
        id: p.id, dropped: p.dropped, wobble: p.wobble, dropStart: p.dropStart,
        dropOffY: p.dropOffY, dropAngle: p.dropAngle,
      })),
    });

    const target = this._getTarget(screw);
    screw.flyTarget = target;
    screw.flyStart = null;
    screw.clickScale = 0.85;

    this._animUn(screw, () => {
      this.audio.play('unscrew');
      this.ps.push(...sparks(screw.x, screw.y, screw.color.f, 8));

      screw.flyStart = { x: screw.x, y: screw.y - 35 };
      screw.animPhase = 'flying';
      this._animFly(screw, () => {
        screw.removed = true;
        screw.animPhase = 'done';
        this.busy = false;
        this.ps.push(...sparks(target.x, target.y, screw.color.g, 12));
        this._place(screw);
      });
    });
  }

  _getTarget(screw) {
    const st = this.st;
    if (st.activeBox && st.activeBox.n === screw.color.n) {
      return { x: 201, y: 82 };
    }
    const tx = (420 - st.tempMax * 44) / 2;
    const slotIdx = Math.min(st.temp.length, st.tempMax - 1);
    return { x: tx + slotIdx * 44 + 19, y: 540 };
  }

  _place(screw) {
    const st = this.st;
    const c = screw.color;

    if (st.activeBox && st.activeBox.n === c.n) {
      if (!st.combo) st.combo = 0;
      st.combo++;
      st.comboTime = Date.now();
      if (st.combo >= 3) this.ps.push(...burst(210, 65, '#ffd700', 6));

      st.activeCount++;
      this.audio.play('boxIn');
      st.boxGlow = Date.now();
      this.ps.push(...sparks(screw.x, screw.y, c.g, 6));
      if (st.activeCount >= st.cap) {
        this.audio.play('boxFull');
        this.ps.push(...burst(210, 65, c.g, 18));
        st.activeBox = st.boxes.length > 0 ? st.boxes.shift() : null;
        st.activeCount = 0;
        this._autoMatch();
      }
    } else {
      st.combo = 0;
      if (st.temp.length >= st.tempMax) {
        this.audio.play('lose');
        setTimeout(() => document.getElementById('ovLose').classList.remove('hidden'), 400);
        return;
      }
      st.temp.push({ color: c });
      this.audio.play('boxIn');
    }

    this._checkPanels();
    if (st.screws.every(s => s.removed)) {
      // 所有螺丝清除，先自动收纳暂存区
      setTimeout(() => this._autoClearTemp(), 600);
    }
  }

  _autoMatch() {
    const st = this.st;
    if (!st.activeBox) return;
    for (let i = st.temp.length-1; i >= 0; i--) {
      if (st.temp[i].color.n === st.activeBox.n) {
        st.temp.splice(i, 1);
        st.activeCount++;
        this.audio.play('boxIn');
        if (st.activeCount >= st.cap) {
          this.audio.play('boxFull');
          this.ps.push(...burst(210, 65, st.activeBox.g, 14));
          st.activeBox = st.boxes.length > 0 ? st.boxes.shift() : null;
          st.activeCount = 0;
          if (!st.activeBox) break;
        }
      }
    }
  }

  _autoClearTemp() {
    const st = this.st;
    if (st.temp.length === 0) {
      setTimeout(() => this._win(), 300);
      return;
    }
    this._autoClearing = true;

    // 逐个将暂存区螺丝自动匹配
    const processNext = () => {
      if (st.temp.length === 0 || !st.activeBox) {
        // 没有可匹配的了（或盒子用完了），结束
        this._autoClearing = false;
        setTimeout(() => this._win(), 400);
        return;
      }

      // 找匹配当前盒子的暂存螺丝
      let idx = -1;
      for (let i = st.temp.length-1; i >= 0; i--) {
        if (st.temp[i].color.n === st.activeBox.n) { idx = i; break; }
      }

      if (idx >= 0) {
        st.temp.splice(idx, 1);
        st.activeCount++;
        this.audio.play('autoMatch');
        st.boxGlow = Date.now();
        const target = { x: 196, y: 80 };
        this.ps.push(...sparks(target.x, target.y, st.activeBox.g, 8));

        if (st.activeCount >= st.cap) {
          this.audio.play('boxFull');
          this.ps.push(...burst(210, 65, st.activeBox.g, 14));
          st.activeBox = st.boxes.length > 0 ? st.boxes.shift() : null;
          st.activeCount = 0;
        }
        setTimeout(processNext, 250);
      } else {
        // 当前盒子不匹配任何暂存螺丝，换下一个盒子试试
        if (st.boxes.length > 0) {
          // 当前盒子放回队列末尾（暂存螺丝可能匹配后面的）
          const curBox = st.activeBox;
          st.activeBox = st.boxes.shift();
          st.activeCount = 0;
          st.boxes.push(curBox);
          // 防止无限循环：如果转了一圈还没匹配到，停止
          setTimeout(processNext, 200);
        } else {
          // 没有更多盒子了
          this._autoClearing = false;
          setTimeout(() => this._win(), 400);
        }
      }
    };
    processNext();
  }

  _checkPanels() {
    for (const p of this.st.panels) {
      if (p.dropped || p.dropStart) continue;
      const remain = p.screws.filter(s => !s.removed).length;
      if (remain === 0) {
        p.dropStart = Date.now();
        p.dropAngle = 0;
        p.dropOffY = 0;
        p.dropPivotX = p.cx;
        p.dropPivotY = p.cy;
        this.audio.play('panelDrop');
        this.ps.push(...panelBurst(p));
        setTimeout(() => { p.dropped = true; }, 800);
      } else if (remain === 1 && !p.wobble) {
        p.wobble = true;
        this.audio.play('panelWobble');
      }
    }
  }

  _win() {
    this.audio.play('win');
    const st = this.st;
    const undos = this.hist.length;
    let stars = 3;
    if (undos > st.screws.length * 0.35) stars = 2;
    if (undos > st.screws.length * 0.7) stars = 1;
    document.getElementById('starsShow').textContent = '⭐'.repeat(stars)+'☆'.repeat(3-stars);
    document.getElementById('winMsg').textContent = `第 ${st.level} 关完成！撤销 ${undos} 次`;
    document.getElementById('ovWin').classList.remove('hidden');
    for (let i=0;i<40;i++) {
      setTimeout(() => {
        this.ps.push(...burst(60+Math.random()*300, 100+Math.random()*400, COLS[Math.floor(Math.random()*6)].g, 8));
      }, i*30);
    }
  }

  undo() {
    if (this.busy || this.hist.length === 0 || this._autoClearing) return;
    const rec = this.hist.pop();
    const s = this.st.screws.find(s => s.id === rec.sid);
    if (!s) return;
    s.removed = false;
    s.animPhase = null;
    s.flyStart = null;
    s.flyTarget = null;
    s.clickScale = 1;
    this.st.activeBox = rec.box;
    this.st.activeCount = rec.cnt;
    this.st.boxes = rec.queue;
    this.st.temp = rec.temp;
    if (rec.panels) {
      for (const ps of rec.panels) {
        const p = this.st.panels.find(p => p.id === ps.id);
        if (p) {
          p.dropped = ps.dropped;
          p.wobble = ps.wobble;
          p.dropStart = ps.dropStart;
          p.dropOffY = ps.dropOffY;
          p.dropAngle = ps.dropAngle;
        }
      }
    }
    this.audio.play('click');
  }

  hint() {
    if (this.busy || !this.st || this._autoClearing) return;
    const st = this.st;
    let best = null;
    for (const s of st.screws) {
      if (s.removed) continue;
      const p = st.panels.find(p => p.id === s.panelId);
      if (p && !p.dropped && this._blocked(p)) continue;
      if (st.activeBox && s.color.n === st.activeBox.n) { best = s; break; }
      if (!best) best = s;
    }
    if (best) {
      this.hinted = best;
      this.audio.play('hint');
      setTimeout(() => { this.hinted = null; }, 2000);
    }
  }

  // ===== 动画 =====
  _animUn(screw, cb) {
    const dur = 14;
    let f = 0;
    const sx = screw.x, sy = screw.y;
    const step = () => {
      f++;
      screw.animPhase = 'unscrewing';
      screw.animT = f / dur;
      screw.animX = sx;
      screw.animY = sy - 35 * screw.animT;
      screw.animR = screw.animT * Math.PI * 2.5;
      if (f % 3 === 0) this.ps.push(...sparks(screw.animX, screw.animY, screw.color.f, 2));
      if (screw.clickScale && screw.clickScale < 1) screw.clickScale += 0.02;
      if (f >= dur) { screw.animT = 1; screw.clickScale = 1; cb(); }
      else requestAnimationFrame(step);
    };
    step();
  }

  _animFly(screw, cb) {
    const dur = 18;
    let f = 0;
    const from = screw.flyStart;
    const to = screw.flyTarget;
    const step = () => {
      f++;
      const t = f / dur;
      const ease = 1 - Math.pow(1 - t, 3);
      screw.flyX = from.x + (to.x - from.x) * ease;
      const arc = Math.sin(t * Math.PI) * 60;
      screw.flyY = from.y + (to.y - from.y) * ease - arc;
      screw.flyScale = 1 - t * 0.4;
      screw.flyR = t * Math.PI * 1.5;
      if (f % 2 === 0) this.ps.push({
        x: screw.flyX + (Math.random()-0.5)*6,
        y: screw.flyY + (Math.random()-0.5)*6,
        vx: (Math.random()-0.5)*1, vy: (Math.random()-0.5)*1,
        life: 0.6, decay: 0.05, size: 1.5 + Math.random()*2,
        color: screw.color.g,
      });
      if (f >= dur) { screw.flyX = to.x; screw.flyY = to.y; cb(); }
      else requestAnimationFrame(step);
    };
    step();
  }

  // ===== 渲染 =====
  _loop() {
    this._draw();
    requestAnimationFrame(() => this._loop());
  }

  _draw() {
    const ctx = this.ctx, W = this.W, H = this.H, S = this.S;
    ctx.clearRect(0, 0, this.cvs.width, this.cvs.height);

    ctx.fillStyle = '#12122a';
    ctx.fillRect(0, 0, this.cvs.width, this.cvs.height);
    ctx.strokeStyle = 'rgba(255,255,255,0.025)';
    ctx.lineWidth = 0.5;
    for (let x=0;x<W;x+=28){ctx.beginPath();ctx.moveTo(x*S,0);ctx.lineTo(x*S,H*S);ctx.stroke();}
    for (let y=0;y<H;y+=28){ctx.beginPath();ctx.moveTo(0,y*S);ctx.lineTo(W*S,y*S);ctx.stroke();}

    ctx.save();
    ctx.scale(S, S);

    const st = this.st;
    if (!st) { ctx.restore(); return; }

    const GX=30, GY=130, GW=360, GH=340;
    const clipBottom = GY + GH; // 470

    let shakeX = 0, shakeY = 0;
    if (this.shakeStart) {
      const elapsed = Date.now() - this.shakeStart;
      if (elapsed < this.shakeDur) {
        const decay = 1 - elapsed / this.shakeDur;
        shakeX = (Math.random()-0.5) * this.shakeX * decay;
        shakeY = (Math.random()-0.5) * this.shakeX * decay;
      } else { this.shakeX = 0; }
    }

    const bgGrad = ctx.createRadialGradient(210, 320, 30, 210, 320, 280);
    bgGrad.addColorStop(0, 'rgba(100,150,200,0.06)');
    bgGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(GX, GY, GW, GH);

    this._drawDecorGear(ctx, 55, 155, 22, 0.03);
    this._drawDecorGear(ctx, 370, 310, 28, 0.025);
    this._drawDecorGear(ctx, 355, 145, 18, 0.02);

    ctx.fillStyle = 'rgba(255,255,255,0.025)';
    rrect(ctx, GX+shakeX, GY+shakeY, GW, GH, 16);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    rrect(ctx, GX+shakeX, GY+shakeY, GW, GH, 16);
    ctx.stroke();

    // 蒙版裁剪线
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(GX, clipBottom);
    ctx.lineTo(GX+GW, clipBottom);
    ctx.stroke();

    // 面板绘制
    ctx.save();
    ctx.translate(shakeX, shakeY);
    ctx.save();
    ctx.beginPath();
    // 扩大裁剪区 — 让木板有更多下落空间
    ctx.rect(GX-30, GY-30, GW+60, GH+100);
    ctx.clip();

    const panels = [...st.panels].sort((a,b) => a.layer - b.layer);
    for (const p of panels) {
      if (p.dropped) continue;
      this._drawPanel(ctx, p, clipBottom);
    }
    ctx.restore();

    for (const s of st.screws) {
      if (s.removed && s.animPhase !== 'flying') continue;
      let sx = s.x, sy = s.y, rot = 0, sc = 1;
      if (s.animPhase === 'unscrewing' && s.animT < 1) {
        sx = s.animX; sy = s.animY; rot = s.animR; sc = s.clickScale || 1;
      } else if (s.animPhase === 'flying') {
        sx = s.flyX; sy = s.flyY; rot = s.flyR; sc = s.flyScale;
      } else if (s.clickScale && s.clickScale < 1) {
        sc = s.clickScale;
      }
      this._drawScrew(ctx, sx, sy, s.color, s === this.hinted, rot, sc);
    }

    for (const p of this.ps) {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size*p.life, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    this._drawBoxes(ctx, st);
    this._drawTemp(ctx, st);

    // 自动收纳提示
    if (this._autoClearing) {
      ctx.fillStyle = 'rgba(255,215,0,0.7)';
      ctx.font = 'bold 15px "PingFang SC","Microsoft YaHei"';
      ctx.textAlign = 'center';
      ctx.fillText('✨ 自动收纳暂存螺丝...', 210, 490);
    }

    if (st.combo && st.combo > 1) {
      const alpha = Math.max(0, 1 - (Date.now() - st.comboTime) / 1200);
      ctx.fillStyle = `rgba(255,215,0,${alpha})`;
      ctx.font = 'bold 18px "PingFang SC","Microsoft YaHei"';
      ctx.textAlign = 'center';
      ctx.fillText(`🔥 连击 x${st.combo}`, 210, 310);
    }

    ctx.restore();

    this.ps = this.ps.filter(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life -= p.decay;
      return p.life > 0;
    });
  }

  _drawPanel(ctx, p, clipBottom) {
    const R = 16;
    const x = p.cx - p.w/2, y = p.cy - p.h/2;
    const wood = p.wood || WOODS[0];

    let dropOffY = 0, dropAngle = 0;
    if (p.dropStart) {
      const elapsed = (Date.now() - p.dropStart) / 1000;
      // 更慢的下落速度：加速度减半
      dropOffY = elapsed * elapsed * 160;
      dropAngle = Math.sin(elapsed * 2.5) * 0.35 * Math.min(elapsed * 1.5, 1);
      p.dropOffY = dropOffY;
      p.dropAngle = dropAngle;
      // 给更多下落空间才消失
      if (p.cy + dropOffY - p.h/2 > clipBottom + 80) return;
    }

    ctx.save();

    if (p.wobble && !p.dropStart) {
      const wb = Math.sin(Date.now()/130) * 2;
      ctx.translate(wb, 0);
    }

    if (p.dropStart) {
      ctx.translate(p.cx, p.cy);
      if (dropAngle) ctx.rotate(dropAngle);
      ctx.translate(0, dropOffY);
      ctx.translate(-p.cx, -p.cy);
    }

    // 外层阴影
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    rrect(ctx, x+3, y+3, p.w, p.h, R);
    ctx.fill();
    // 内层阴影
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    rrect(ctx, x+1, y+1, p.w, p.h, R);
    ctx.fill();

    // 面板主体 — 使用 wood 配色
    const grad = ctx.createLinearGradient(x, y, x+p.w, y+p.h);
    grad.addColorStop(0, wood.light);
    grad.addColorStop(0.35, wood.base);
    grad.addColorStop(0.7, wood.base);
    grad.addColorStop(1, wood.dark);
    ctx.fillStyle = grad;
    rrect(ctx, x, y, p.w, p.h, R);
    ctx.fill();

    // 顶部高光条
    const hiGrad = ctx.createLinearGradient(x, y, x, y+p.h*0.45);
    hiGrad.addColorStop(0, 'rgba(255,255,255,0.22)');
    hiGrad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = hiGrad;
    rrect(ctx, x+5, y+3, p.w-10, p.h*0.35, R-4);
    ctx.fill();

    // 边框
    ctx.strokeStyle = 'rgba(0,0,0,0.15)';
    ctx.lineWidth = 1.2;
    rrect(ctx, x, y, p.w, p.h, R);
    ctx.stroke();

    // 内边框 — 浅色
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 0.8;
    rrect(ctx, x+1.5, y+1.5, p.w-3, p.h-3, R-1);
    ctx.stroke();

    // 木纹 — 更真实的多层纹理
    ctx.save();
    ctx.beginPath();
    rrect(ctx, x, y, p.w, p.h, R);
    ctx.clip();

    // 横向纹理线
    ctx.strokeStyle = 'rgba(0,0,0,0.04)';
    ctx.lineWidth = 0.6;
    for (let i = -p.h/2 + p.h*0.15; i < p.h/2; i += p.h*0.22) {
      ctx.beginPath();
      ctx.moveTo(x+6, p.cy+i);
      ctx.quadraticCurveTo(p.cx, p.cy+i+1.5, x+p.w-6, p.cy+i);
      ctx.stroke();
    }

    // 竖向细纹（木纹纤维感）
    ctx.strokeStyle = 'rgba(0,0,0,0.025)';
    ctx.lineWidth = 0.4;
    for (let i = -p.w/2 + p.w*0.2; i < p.w/2; i += p.w*0.3) {
      ctx.beginPath();
      ctx.moveTo(p.cx + i, y+5);
      ctx.quadraticCurveTo(p.cx + i + (Math.random()-0.5)*4, p.cy, p.cx + i, y+p.h-5);
      ctx.stroke();
    }

    // 随机木节
    ctx.fillStyle = 'rgba(0,0,0,0.04)';
    ctx.beginPath();
    ctx.ellipse(p.cx + p.w*0.25, p.cy + p.h*0.15, 3, 2, 0.3, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(p.cx - p.w*0.2, p.cy - p.h*0.1, 2.5, 1.8, -0.2, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();

    // 螺丝孔标记（浅色小圆）
    for (const s of p.screws) {
      if (s.removed) continue;
      ctx.fillStyle = 'rgba(0,0,0,0.08)';
      ctx.beginPath(); ctx.arc(s.x, s.y, 8, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.beginPath(); ctx.arc(s.x-0.5, s.y-1, 3.5, 0, Math.PI*2); ctx.fill();
    }

    ctx.restore();
  }

  _drawScrew(ctx, x, y, col, hint, rot, scale) {
    ctx.save();
    ctx.translate(x, y);
    if (scale && scale !== 1) ctx.scale(scale, scale);
    if (rot) ctx.rotate(-rot);

    const r = 12;
    if (hint) {
      const pulse = Math.sin(Date.now()/150)*0.4+0.6;
      ctx.shadowColor = col.g;
      ctx.shadowBlur = 34 * pulse;
    }

    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.arc(1.5, 2, r, 0, Math.PI*2); ctx.fill();

    ctx.beginPath();
    for (let i=0;i<6;i++) {
      const a = Math.PI/6 + i*Math.PI/3;
      const nx = r*Math.cos(a), ny = r*Math.sin(a);
      const a1 = a - Math.PI/6, a2 = a + Math.PI/6;
      const sx = r*0.85*Math.cos(a1), sy = r*0.85*Math.sin(a1);
      const ex = r*0.85*Math.cos(a2), ey = r*0.85*Math.sin(a2);
      if (i===0) ctx.moveTo(sx, sy);
      ctx.quadraticCurveTo(nx, ny, ex, ey);
    }
    ctx.closePath();

    const grad = ctx.createRadialGradient(-2,-2.5, r*0.05, 1,1, r*1.2);
    grad.addColorStop(0, lighten(col.f, 55));
    grad.addColorStop(0.2, lighten(col.f, 25));
    grad.addColorStop(0.5, col.f);
    grad.addColorStop(0.8, col.d);
    grad.addColorStop(1, 'rgba(0,0,0,0.3)');
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 0.6;
    ctx.stroke();

    ctx.beginPath(); ctx.arc(0, 0, r*0.62, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 0.5;
    ctx.stroke();

    const slotW = 1.2, slotL = r * 0.5;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(-slotW, -slotL, slotW*2, slotL*2);
    ctx.fillRect(-slotL, -slotW, slotL*2, slotW*2);
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillRect(-slotW, -slotL, 0.6, slotL*2);
    ctx.fillRect(-slotL, -slotW, slotL*2, 0.6);

    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath();
    ctx.ellipse(-r*0.25, -r*0.35, r*0.28, r*0.2, -0.5, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.beginPath();
    ctx.ellipse(r*0.2, r*0.3, r*0.35, r*0.12, 0.3, 0, Math.PI*2);
    ctx.fill();

    if (hint) {
      const hp = Math.sin(Date.now()/180)*0.35+0.65;
      ctx.strokeStyle = `rgba(255,215,0,${0.4*hp})`;
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(0,0,r+8,0,Math.PI*2); ctx.stroke();
      ctx.strokeStyle = `rgba(255,255,255,${0.5+Math.sin(Date.now()/180)*0.3})`;
      ctx.lineWidth = 3;
      ctx.setLineDash([4, 4]);
      ctx.lineDashOffset = -Date.now()/60;
      ctx.beginPath(); ctx.arc(0,0,r+4,0,Math.PI*2); ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.restore();
  }

  _drawBoxes(ctx, st) {
    if (!st.activeBox) return;
    const Y = 62, BW = 52, BH = 36;

    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    rrect(ctx, 24, Y-6, 372, BH+16, 12);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.font = '10px "PingFang SC","Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText('当前收纳盒', 210, Y-2);

    const bx = 175, by = Y+6;
    let glowExtra = 0;
    if (st.boxGlow) {
      const elapsed = Date.now() - st.boxGlow;
      if (elapsed < 400) glowExtra = (1 - elapsed/400) * 16;
    }
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    rrect(ctx, bx-2, by-2, BW+4, BH+4, 9);
    ctx.fill();
    ctx.strokeStyle = st.activeBox.g;
    ctx.lineWidth = 2;
    ctx.shadowColor = st.activeBox.g;
    ctx.shadowBlur = 8 + glowExtra;
    rrect(ctx, bx-2, by-2, BW+4, BH+4, 9);
    ctx.stroke();
    ctx.shadowBlur = 0;

    const g2 = ctx.createLinearGradient(bx, by, bx, by+BH);
    g2.addColorStop(0, st.activeBox.f);
    g2.addColorStop(1, st.activeBox.d);
    ctx.fillStyle = g2;
    rrect(ctx, bx, by, BW, BH, 7);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.28)';
    ctx.lineWidth = 1;
    rrect(ctx, bx, by, BW, BH, 7);
    ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px "PingFang SC","Microsoft YaHei"';
    ctx.fillText(`${st.activeCount}/${st.cap}`, bx+BW/2, by+BH/2+5);

    if (st.boxes.length > 0) {
      const nx = 254, ny = by;
      ctx.fillStyle = st.boxes[0].f;
      rrect(ctx, nx, ny+2, 26, BH-4, 6);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.font = '9px "PingFang SC","Microsoft YaHei"';
      ctx.fillText('下一个', nx+13, ny-8);
      if (st.boxes.length > 1) {
        ctx.fillText(`+${st.boxes.length-1}`, nx+42, ny+BH/2+4);
      }
    }
  }

  _drawTemp(ctx, st) {
    const tx = (420 - st.tempMax * 44) / 2, ty = 520;
    for (let i=0;i<st.tempMax;i++) {
      const x = tx + i*44, y = ty;
      if (i < st.temp.length) {
        const c = st.temp[i].color;
        ctx.fillStyle = c.f;
        rrect(ctx, x, y, 38, 38, 9);
        ctx.fill();
        ctx.strokeStyle = c.g;
        ctx.lineWidth = 1.5;
        rrect(ctx, x, y, 38, 38, 9);
        ctx.stroke();
      } else {
        ctx.strokeStyle = 'rgba(255,255,255,0.18)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4,3]);
        rrect(ctx, x, y, 38, 38, 9);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = '10px "PingFang SC","Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText('临时存放', 210, ty-8);
  }

  _drawDecorGear(ctx, cx, cy, r, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 0.8;
    const teeth = 8;
    const ir = r * 0.55;
    ctx.beginPath();
    for (let i = 0; i < teeth * 2; i++) {
      const a = i * Math.PI / teeth - Math.PI/2;
      const cr = i % 2 === 0 ? r : ir;
      const px = cx + cr * Math.cos(a);
      const py = cy + cr * Math.sin(a);
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, ir * 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

// ===== 辅助函数 =====
function rrect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r); ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}

function lighten(hex, pct) {
  const n = parseInt(hex.replace('#',''),16);
  const a = Math.round(2.55*pct);
  const R = Math.min(255,(n>>16)+a), G = Math.min(255,(n>>8&0xFF)+a), B = Math.min(255,(n&0xFF)+a);
  return `rgb(${R},${G},${B})`;
}

function sparks(x, y, color, n) {
  const a = [];
  for (let i=0;i<n;i++) {
    const ang = Math.random()*Math.PI*2;
    const spd = 1+Math.random()*3;
    a.push({x,y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,life:1,decay:.025+Math.random()*.04,size:1.5+Math.random()*2.5,color});
  }
  return a;
}

function burst(x, y, color, n) {
  const a = [];
  for (let i=0;i<n;i++) {
    const ang = Math.random()*Math.PI*2;
    const spd = 2+Math.random()*5;
    a.push({x,y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-1.5,life:1,decay:.018+Math.random()*.03,size:2+Math.random()*4,color});
  }
  return a;
}

function panelBurst(p) {
  const a = [];
  for (let i=0;i<18;i++) {
    a.push({
      x: p.cx+(Math.random()-.5)*p.w,
      y: p.cy+(Math.random()-.5)*p.h,
      vx: (Math.random()-.5)*5,
      vy: (Math.random()-.5)*5+2,
      life: 1,
      decay: .014+Math.random()*.025,
      size: 2.5+Math.random()*4.5,
      color: p.wood ? p.wood.base : p.color,
    });
  }
  return a;
}

function hideAll() {
  ['ovStart','ovWin','ovLose','ovPause'].forEach(id => document.getElementById(id).classList.add('hidden'));
}

// ===== 启动 =====
const G = new Game();
</script>
