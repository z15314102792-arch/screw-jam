<script>
// ==================== 音效引擎 ====================
class Audio {
  constructor() {
    this.on = true; this.ctx = null; this.master = null; this.bgmGain = null;
    this._unlocked = false; this._bgmNodes = []; this._bgmTimer = null; this._boot();
  }
  _boot() {
    const doUnlock = () => {
      if (this._unlocked) return; this._unlocked = true;
      try {
        this.ctx = new (window.AudioContext||window.webkitAudioContext)();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        this.master = this.ctx.createGain(); this.master.gain.value = 0.85;
        this.master.connect(this.ctx.destination);
        this.bgmGain = this.ctx.createGain(); this.bgmGain.gain.value = 0.9;
        this.bgmGain.connect(this.master);
      } catch(e) { this.on = false; }
    };
    if (typeof WeixinJSBridge !== 'undefined') {
      try { WeixinJSBridge.invoke('getNetworkType', {}, () => doUnlock()); } catch(e) {}
    }
    document.addEventListener('WeixinJSBridgeReady', () => {
      try { WeixinJSBridge.invoke('getNetworkType', {}, () => doUnlock()); } catch(e) {}
    }, {once:true});
    ['touchstart','mousedown','click'].forEach(evt => {
      document.addEventListener(evt, () => { if (!this._unlocked) doUnlock(); }, {once:true, passive:true});
    });
    setTimeout(() => { if (!this._unlocked) doUnlock(); }, 800);
  }
  t() { return this.ctx ? this.ctx.currentTime : 0; }

  play(k) {
    if (!this.on || !this.ctx) return;
    const t = this.t(), m = this.master;
    const tone = (f, dur, vol, type, fe) => {
      const o = this.ctx.createOscillator(); o.type = type||'sine'; o.frequency.setValueAtTime(f,t);
      if (fe) o.frequency.exponentialRampToValueAtTime(fe,t+dur);
      const g = this.ctx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
      o.connect(g); g.connect(m); o.start(t); o.stop(t+dur);
    };
    const noise = (dur, flo, fhi, q, vol) => {
      const buf = this.ctx.createBuffer(1, this.ctx.sampleRate*dur, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(this.ctx.sampleRate*0.015));
      const s=this.ctx.createBufferSource(); s.buffer=buf;
      const flt=this.ctx.createBiquadFilter();
      if(flo&&fhi){flt.type='bandpass';flt.frequency.value=(flo+fhi)/2;flt.Q.value=q||3;}
      else{flt.type='lowpass';flt.frequency.value=flo||800;}
      const g=this.ctx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
      s.connect(flt);flt.connect(g);g.connect(m);s.start(t);s.stop(t+dur);
    };
    switch(k){
      case 'unscrew': noise(0.1,2500,4500,5,0.07); for(let i=0;i<3;i++)tone(2200+i*150,0.03,0.05,'sine'); break;
      case 'boxIn': tone(750,0.07,0.09,'triangle',380); break;
      case 'boxFull': [523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,0.28,0.07,'sine'),i*80)); break;
      case 'panelDrop': tone(180,0.28,0.12,'sine',50); noise(0.15,300,1000,2,0.06); break;
      case 'panelWobble': tone(110,0.25,0.05,'sine'); break;
      case 'panelTilt': tone(150,0.2,0.04,'triangle',100); break;
      case 'win': [523,659,784,1047,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.35,0.09,'sine'),i*95)); break;
      case 'lose': tone(180,0.3,0.07,'square',110); break;
      case 'hint': [700,900].forEach((f,i)=>setTimeout(()=>tone(f,0.2,0.05,'sine'),i*100)); break;
      case 'click': tone(1100,0.025,0.03,'sine'); break;
      case 'autoMatch': tone(650,0.12,0.06,'triangle',400); break;
    }
  }

  bgm() { if (this.on && this.ctx) this._bgmLoop(); }
  _bgmLoop() {
    if (!this.on || !this.ctx) return;
    const ctx = this.ctx, t = this.t(), mg = this.bgmGain;
    // 舒缓氛围 — 慢板五声音阶 + 温暖铺底，放松不头疼
    // Am 五声：A4 C5 D5 E5 G5 A5 (440-880Hz)
    const melody = [
      440, 523.2, 587.3, 659.2,  // A4 C5 D5 E5
      784, 659.2, 587.3, 523.2,  // G5 E5 D5 C5
      440, 523.2, 659.2, 784,     // A4 C5 E5 G5
      659.2, 587.3, 523.2, 440,  // E5 D5 C5 A4
    ];
    const beat = 0.92; // 慢板 ~65 BPM
    melody.forEach((freq, i) => {
      const start = t + i * beat;
      const o = ctx.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(freq, start);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, start);
      g.gain.linearRampToValueAtTime(0.28, start + 0.08); // 柔和起音
      g.gain.setValueAtTime(0.28, start + beat * 0.55);
      g.gain.linearRampToValueAtTime(0, start + beat * 0.92); // 自然衰减
      o.connect(g); g.connect(mg);
      o.start(start); o.stop(start + beat);
      this._bgmNodes.push(o);
    });
    // 温暖泛音铺底 (Am 和弦 A-C-E 泛音)
    const padNotes = [440, 523.2, 659.2];
    padNotes.forEach(freq => {
      const po = ctx.createOscillator(); po.type = 'sine';
      po.frequency.setValueAtTime(freq, t);
      const pg = ctx.createGain();
      pg.gain.setValueAtTime(0, t);
      pg.gain.linearRampToValueAtTime(0.07, t + 1.2);
      pg.gain.setValueAtTime(0.07, t + melody.length * beat * 0.75);
      pg.gain.linearRampToValueAtTime(0, t + melody.length * beat);
      po.connect(pg); pg.connect(mg);
      po.start(t); po.stop(t + melody.length * beat);
      this._bgmNodes.push(po);
    });
    this._bgmTimer = setTimeout(() => this._bgmLoop(), melody.length * beat * 1000);
  }
  stopBGM() {
    clearTimeout(this._bgmTimer);
    this._bgmNodes.forEach(n => { try{n.stop()}catch(e){} });
    this._bgmNodes = [];
  }
}

// ==================== 面板形状定义 ====================
const SHAPE_RECT = 'rect', SHAPE_CIRCLE = 'circle', SHAPE_TRI = 'triangle', SHAPE_HEX = 'hexagon';
const ALL_SHAPES = [SHAPE_RECT, SHAPE_RECT, SHAPE_RECT, SHAPE_CIRCLE, SHAPE_TRI, SHAPE_HEX]; // 矩形偏多

function shapePath(ctx, cx, cy, w, h, shape) {
  ctx.beginPath();
  const r = Math.min(w, h) / 2;
  switch (shape) {
    case SHAPE_CIRCLE:
      ctx.ellipse(cx, cy, w/2, h/2, 0, 0, Math.PI*2); break;
    case SHAPE_TRI:
      ctx.moveTo(cx, cy - h/2); ctx.lineTo(cx + w/2, cy + h/2); ctx.lineTo(cx - w/2, cy + h/2); ctx.closePath(); break;
    case SHAPE_HEX:
      for (let i=0;i<6;i++) { const a=Math.PI/6+i*Math.PI/3; const px=cx+Math.cos(a)*r, py=cy+Math.sin(a)*r; i===0?ctx.moveTo(px,py):ctx.lineTo(px,py); } ctx.closePath(); break;
    default: // rect
      const R=14; ctx.moveTo(cx-w/2+R,cy-h/2); ctx.lineTo(cx+w/2-R,cy-h/2);
      ctx.quadraticCurveTo(cx+w/2,cy-h/2,cx+w/2,cy-h/2+R); ctx.lineTo(cx+w/2,cy+h/2-R);
      ctx.quadraticCurveTo(cx+w/2,cy+h/2,cx+w/2-R,cy+h/2); ctx.lineTo(cx-w/2+R,cy+h/2);
      ctx.quadraticCurveTo(cx-w/2,cy+h/2,cx-w/2,cy+h/2-R); ctx.lineTo(cx-w/2,cy-h/2+R);
      ctx.quadraticCurveTo(cx-w/2,cy-h/2,cx-w/2+R,cy-h/2); ctx.closePath(); break;
  }
}

function shapeContains(cx, cy, w, h, shape, px, py) {
  const dx = px - cx, dy = py - cy;
  switch (shape) {
    case SHAPE_CIRCLE: return (dx*dx)/(w*w/4) + (dy*dy)/(h*h/4) <= 1;
    case SHAPE_TRI: {
      const hw=w/2, hh=h/2;
      const yNorm = (dy + hh) / h; if (yNorm < 0 || yNorm > 1) return false;
      const maxHW = hw * (1 - yNorm);
      return Math.abs(dx) <= maxHW - 4;
    }
    case SHAPE_HEX: {
      const r = Math.min(w, h) / 2;
      return dx*dx + dy*dy <= r*r && Math.abs(dy) <= r*0.87;
    }
    default: return Math.abs(dx) <= w/2 - 4 && Math.abs(dy) <= h/2 - 4;
  }
}

// ==================== 关卡生成器 ====================
const COLS = [
  {n:'red', f:'#e94560', g:'#ff6b6b', d:'#a71d3a'},
  {n:'blue', f:'#4d96ff', g:'#6db3ff', d:'#1a56b8'},
  {n:'green', f:'#2ecc71', g:'#58d68d', d:'#1a7a3a'},
  {n:'yellow', f:'#f1c40f', g:'#f9e154', d:'#b8960a'},
  {n:'purple', f:'#9b59b6', g:'#bb8fce', d:'#6c3483'},
  {n:'orange', f:'#e67e22', g:'#f0a04b', d:'#a05517'},
];
const WOODS = [
  {base:'#e8d5b7', dark:'#c4a882', light:'#f5ede0', name:'浅橡木'},
  {base:'#d4c0a0', dark:'#b89a7a', light:'#e8dcc8', name:'蜂蜜木'},
  {base:'#c9a882', dark:'#a07850', light:'#e0c8a8', name:'核桃木'},
  {base:'#bfa88a', dark:'#967855', light:'#d8c8b0', name:'柚木'},
  {base:'#dcc8a8', dark:'#b89870', light:'#f0e0c8', name:'枫木'},
  {base:'#b89578', dark:'#8c6a4a', light:'#d4b898', name:'樱桃木'},
  {base:'#e0c090', dark:'#b89860', light:'#f5e8c8', name:'松木'},
  {base:'#c8b8a0', dark:'#a09078', light:'#e0d8c8', name:'灰木'},
];

function genLevel(lv) {
  let numCol, cap, numPanel, tempMax;
  // 策略核心：少临时位+首盒颜色藏在底层=必须规划消除顺序
  if (lv === 1)               { numCol=2; cap=3; numPanel=3; tempMax=5; }
  else if (lv === 2)          { numCol=2; cap=3; numPanel=5; tempMax=4; }
  else if (lv <= 3)           { numCol=3; cap=3; numPanel=6; tempMax=4; }
  else if (lv <= 5)           { numCol=3; cap=3; numPanel=7; tempMax=4; }
  else if (lv <= 7)           { numCol=4; cap=3; numPanel=8; tempMax=4; }
  else if (lv <= 10)          { numCol=4; cap=3; numPanel=9; tempMax=4; }
  else if (lv <= 13)          { numCol=5; cap=3; numPanel=9; tempMax=4; }
  else if (lv <= 17)          { numCol=5; cap=3; numPanel=10; tempMax=5; }
  else                        { numCol=6; cap=3; numPanel=10; tempMax=5; }

  const total = numCol * cap;
  const colors = COLS.slice(0, numCol);
  const GX=30, GY=130, GW=360, GH=340;

  let attempts = 0;
  while (attempts < 150) {
    attempts++;
    const result = _tryGen(lv, colors, cap, total, numPanel, tempMax, GX, GY, GW, GH);
    if (result && _isSolvable(result)) return result;
  }
  return _tryGen(lv, colors, cap, total, numPanel, tempMax, GX, GY, GW, GH);
}

function _tryGen(lv, colors, cap, total, numPanel, tempMax, GX, GY, GW, GH) {
  // 1. 盒子顺序 — 首盒颜色增加难度
  const boxes = []; colors.forEach(c => boxes.push(c)); shuffle(boxes);
  const firstBoxN = boxes[0].n;

  // 2. 螺丝颜色池
  const screwCols = [];
  colors.forEach(c => { for(let i=0;i<cap;i++) screwCols.push(c); });
  shuffle(screwCols);

  // 3. 创建面板（聚集中心确保层间重叠）
  const panels = [];
  for (let i = 0; i < numPanel; i++) {
    const pw = 75 + Math.random() * 85;
    const ph = 52 + Math.random() * 62;
    const spreadX = GW * 0.22, spreadY = GH * 0.20; // 更集中 → 更多重叠
    const cx = GX + GW/2 + (Math.random() - 0.5) * spreadX;
    const cy = GY + GH/2 + (Math.random() - 0.5) * spreadY;
    const wood = WOODS[i % WOODS.length];
    const shape = lv <= 1 ? SHAPE_RECT : ALL_SHAPES[Math.floor(Math.random() * ALL_SHAPES.length)];
    panels.push({ id:i, cx, cy, w:pw, h:ph, shape, screws:[], dropped:false, wobble:false,
      wood, layer:i, _physAngle:0, _pivotX:null, _pivotY:null, _targetAngle:0
    });
  }
  panels.sort((a,b) => a.layer - b.layer);
  panels.forEach((p,i) => { p.layer = i; });

  // 4. 分配每板螺丝数（每板至少1颗，最多4颗，优先给重叠多的板）
  const maxPerPanel = Math.min(4, Math.ceil(total / numPanel) + 1);
  const screwCounts = new Array(numPanel).fill(1);
  let remaining = total - numPanel;
  while (remaining > 0) {
    let best = null, bestScore = -1;
    for (let i = 0; i < numPanel; i++) {
      if (screwCounts[i] >= maxPerPanel) continue;
      const score = countOverlaps(panels[i], panels);
      if (score > bestScore) { bestScore = score; best = i; }
    }
    if (best === null) break;
    screwCounts[best]++; remaining--;
  }

  // 5. ★ 逐层放置：底层散布，上层直接盖下层螺丝（每颗都有意义）
  let si = 0;
  const maxLayer = panels[panels.length - 1].layer;
  for (let layer = 0; layer <= maxLayer; layer++) {
    const layerPanels = panels.filter(p => p.layer === layer);
    for (const p of layerPanels) {
      for (let k = 0; k < screwCounts[p.id] && si < total; k++) {
        let pos;
        if (layer === 0) {
          // 底层：网格均匀散布
          pos = screwSpreadPos(p, k, screwCounts[p.id]);
        } else {
          // 上层：找到可覆盖的下层螺丝，直接盖在上面
          const targets = findCoverTargets(p, panels);
          // 优先选尚未被本板其他螺丝覆盖的目标
          const fresh = targets.filter(t => !p.screws.some(ps =>
            Math.hypot(ps.x - t.x, ps.y - t.y) < 8));
          const pool = fresh.length > 0 ? fresh : targets;
          if (pool.length > 0) {
            const t = pool[Math.floor(Math.random() * pool.length)];
            pos = {
              x: t.x + (Math.random() - 0.5) * 12,
              y: t.y + (Math.random() - 0.5) * 12
            };
            if (!shapeContains(p.cx, p.cy, p.w, p.h, p.shape, pos.x, pos.y)) {
              pos = { x: t.x, y: t.y };
            }
          } else {
            // 无可覆盖目标 → 均匀散布（保底）
            pos = screwSpreadPos(p, k, screwCounts[p.id]);
          }
        }
        const col = assignColor(screwCols, si, p, panels, firstBoxN, total);
        p.screws.push({ id: si, color: col, x: pos.x, y: pos.y, panelId: p.id, removed: false });
        si++;
      }
    }
  }

  const allScrews = panels.flatMap(p => p.screws);
  return {
    level: lv, colors, panels, screws: allScrews, boxes, cap, tempMax,
    activeBox: boxes.shift(), activeCount: 0, temp: [],
  };
}

// 面板上均匀分布螺丝（网格法，避免挤在一起）
function screwSpreadPos(p, idx, total) {
  const cols = Math.ceil(Math.sqrt(total));
  const rows = Math.ceil(total / cols);
  const col = idx % cols;
  const row = Math.floor(idx / cols);
  const fx = (col + 0.5) / cols;
  const fy = (row + 0.5) / rows;
  const margin = 0.18;
  const sx = p.cx - p.w/2 + (margin + fx * (1 - 2*margin)) * p.w;
  const sy = p.cy - p.h/2 + (margin + fy * (1 - 2*margin)) * p.h;
  const jx = (Math.random() - 0.5) * 8;
  const jy = (Math.random() - 0.5) * 8;
  if (shapeContains(p.cx, p.cy, p.w, p.h, p.shape, sx + jx, sy + jy)) {
    return {x: sx + jx, y: sy + jy};
  }
  return {x: sx, y: sy};
}

// 找到上层面板可遮盖的下层螺丝
function findCoverTargets(upper, panels) {
  const targets = [];
  for (const lp of panels) {
    if (lp.layer >= upper.layer) continue;
    if (lp.dropped) continue;
    if (!_overlap(upper, lp)) continue;
    for (const s of lp.screws) {
      if (s.removed) continue;
      if (shapeContains(upper.cx, upper.cy, upper.w, upper.h, upper.shape, s.x, s.y)) {
        targets.push({x: s.x, y: s.y, screw: s, panel: lp});
      }
    }
  }
  return targets;
}

// 统计面板重叠数
function countOverlaps(p, panels) {
  let n = 0;
  for (const op of panels) {
    if (op.id === p.id) continue;
    if (_overlap(p, op)) n++;
  }
  return n;
}

// 螺丝颜色分配：首盒颜色优先底层
function assignColor(screwCols, si, panel, panels, firstBoxN, total) {
  let col = screwCols[si];
  if (col.n === firstBoxN && panel.layer >= 2 && si + 1 < total) {
    for (let j = si + 1; j < Math.min(si + 10, total); j++) {
      if (screwCols[j].n !== firstBoxN) {
        [screwCols[si], screwCols[j]] = [screwCols[j], screwCols[si]];
        col = screwCols[si]; break;
      }
    }
  }
  return col;
}

function _isSolvable(st) {
  const screws = st.screws.map(s => ({...s}));
  const panels = st.panels.map(p => ({...p, dropped:false}));
  const temp = [], tempMax = st.tempMax;
  let activeBox = {...st.activeBox}, activeCount = st.activeCount;
  const boxes = st.boxes.map(b => ({...b}));
  const blocked = (screw) => {
    const p = panels.find(p => p.id === screw.panelId);
    if (!p || p.dropped) return false;
    for (const op of panels) {
      if (op.id === p.id || op.dropped) continue;
      if (op.layer > p.layer && _overlap(op, p)) return true;
    }
    return false;
  };
  let stuck = 0;
  while (screws.some(s=>!s.removed) && stuck < screws.length*3) {
    let found = null;
    for (const s of screws) { if (s.removed || blocked(s)) continue; if (activeBox&&s.color.n===activeBox.n){found=s;break;} }
    if (!found) { for (const s of screws) { if (s.removed||blocked(s)) continue; found=s;break; } }
    if (!found) { stuck++; continue; }
    found.removed = true;
    const panel = panels.find(p=>p.id===found.panelId);
    if (panel && panel.screws.every(ps=>{const s=screws.find(ss=>ss.id===ps.id);return s?s.removed:ps.removed;})) panel.dropped=true;
    if (activeBox && found.color.n===activeBox.n) {
      activeCount++; if (activeCount>=st.cap) { activeBox=boxes.length>0?boxes.shift():null; activeCount=0;
        if (activeBox) { for (let i=temp.length-1;i>=0;i--) { if (temp[i].color.n===activeBox.n) { temp.splice(i,1); activeCount++;
          if (activeCount>=st.cap) { activeBox=boxes.length>0?boxes.shift():null; activeCount=0; if(!activeBox)break; } } } }
      }
    } else { if (temp.length>=tempMax) return false; temp.push({color:found.color}); stuck=0; }
  }
  return screws.every(s=>s.removed);
}

function shuffle(a) { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} }
function _overlap(a, b) {
  return !(a.cx-a.w/2 > b.cx+b.w/2 || a.cx+a.w/2 < b.cx-b.w/2 ||
           a.cy-a.h/2 > b.cy+b.h/2 || a.cy+a.h/2 < b.cy-b.h/2);
}

// ==================== 游戏主类 ====================
class Game {
  constructor() {
    this.cvs = document.getElementById('gc');
    this.ctx = this.cvs.getContext('2d');
    this.audio = new Audio();
    this.st = null; this._seed = null; this.ps = []; this.hist = [];
    this.hinted = null; this.paused = false; this.busy = false;
    this._autoClearing = false; this._flyAuto = [];
    this._size();
    window.addEventListener('resize', () => this._size());
    this.cvs.addEventListener('click', e => this._tap(e));
    this.cvs.addEventListener('touchstart', e => { e.preventDefault(); this._tap(e.touches[0]); }, {passive:false});
    this._loop();
  }

  _size() {
    const r = this.cvs.getBoundingClientRect();
    this.W = r.width; this.H = r.height;
    this.cvs.width = r.width * (devicePixelRatio||1);
    this.cvs.height = r.height * (devicePixelRatio||1);
    this.S = this.cvs.width / r.width;
  }

  _deepClone(obj) { return JSON.parse(JSON.stringify(obj)); }

  start(lv) {
    this.st = genLevel(lv);
    this._seed = this._deepClone(this.st);
    this.ps=[]; this.hist=[]; this.hinted=null; this.busy=false; this.paused=false;
    this._autoClearing=false; this._flyAuto=[];
    this.shakeX=0; this.shakeDur=0; this.shakeStart=null;
    this.st.combo=0; this.st.comboTime=0; this.st.boxGlow=null;
    hideAll();
    document.getElementById('lv').textContent = '第 '+lv+' 关';
    this.audio.bgm();
  }

  next() { this._seed=null; this.start(this.st.level+1); }

  restart() {
    if (this._seed) {
      this.st = this._deepClone(this._seed);
      this.ps=[]; this.hist=[]; this.hinted=null; this.busy=false; this.paused=false;
      this._autoClearing=false; this._flyAuto=[];
      this.shakeX=0; this.shakeDur=0; this.shakeStart=null;
      this.st.combo=0; this.st.comboTime=0; this.st.boxGlow=null;
      hideAll();
      document.getElementById('lv').textContent = '第 '+this.st.level+' 关';
      this.audio.bgm();
    } else { this.start(this.st.level); }
  }

  pause() { this.paused=true; document.getElementById('ovPause').classList.remove('hidden'); }
  resume() { this.paused=false; document.getElementById('ovPause').classList.add('hidden'); }
  sound() {
    this.audio.on = !this.audio.on;
    document.getElementById('btnSound').textContent = this.audio.on ? '🔊' : '🔇';
    if (!this.audio.on) this.audio.stopBGM(); else this.audio.bgm();
  }

  _tap(e) {
    if (this.paused||this.busy||!this.st||this._autoClearing) return;
    const mx = e.clientX - this.cvs.getBoundingClientRect().left;
    const my = e.clientY - this.cvs.getBoundingClientRect().top;
    const st = this.st;
    let best=null, bestD=Infinity;
    for (const s of st.screws) {
      if (s.removed) continue;
      const p = st.panels.find(p=>p.id===s.panelId);
      if (p && !p.dropped && this._blocked(p)) continue;
      const dx=mx-s.x, dy=my-s.y, d=dx*dx+dy*dy;
      if (d<600 && d<bestD) { best=s; bestD=d; }
    }
    if (best) this._remove(best);
  }

  _blocked(panel) {
    for (const p of this.st.panels) {
      if (p.id===panel.id||p.dropped) continue;
      if (p.layer>panel.layer && _overlap(p, panel)) return true;
    }
    return false;
  }

  _remove(screw) {
    const st = this.st;
    this.busy = true;
    this.hist.push({
      sid: screw.id,
      box: st.activeBox?{...st.activeBox}:null, cnt: st.activeCount, queue: [...st.boxes],
      temp: st.temp.map(t=>({...t})),
      panels: st.panels.map(p=>({id:p.id, dropped:p.dropped, wobble:p.wobble, dropStart:p.dropStart, dropOffY:p.dropOffY, dropAngle:p.dropAngle, _physAngle:p._physAngle, _pivotX:p._pivotX, _pivotY:p._pivotY})),
    });

    const target = this._getTarget(screw);
    screw.flyTarget = target; screw.flyStart = null; screw.clickScale = 0.85;

    this._animUn(screw, () => {
      this.audio.play('unscrew');
      this.ps.push(...sparks(screw.x, screw.y, screw.color.f, 8));
      screw.flyStart = { x: screw.x, y: screw.y - 35 };
      screw.animPhase = 'flying';
      this._animFly(screw, () => {
        screw.removed = true; screw.animPhase = 'done'; this.busy = false;
        this.ps.push(...sparks(target.x, target.y, screw.color.g, 12));
        this._place(screw);
      });
    });
  }

  _getTarget(screw) {
    const st = this.st;
    if (st.activeBox && st.activeBox.n === screw.color.n) return { x: 201, y: 82 };
    const tx = (420 - st.tempMax * 44) / 2;
    const slotIdx = Math.min(st.temp.length, st.tempMax - 1);
    return { x: tx + slotIdx * 44 + 19, y: 540 };
  }

  _place(screw) {
    const st = this.st;
    const c = screw.color;

    if (st.activeBox && st.activeBox.n === c.n) {
      if (!st.combo) st.combo=0;
      st.combo++; st.comboTime=Date.now();
      if (st.combo>=3) this.ps.push(...burst(210,65,'#ffd700',6));
      st.activeCount++; this.audio.play('boxIn');
      st.boxGlow = Date.now();
      this.ps.push(...sparks(screw.x, screw.y, c.g, 6));
      if (st.activeCount >= st.cap) {
        this.audio.play('boxFull');
        this.ps.push(...burst(210,65,c.g,18));
        st.activeBox = st.boxes.length>0 ? st.boxes.shift() : null;
        st.activeCount = 0;
        // ★ 修复：最后一颗螺丝填满盒子时，不立即 autoMatch
        // 让 _autoClearTemp 统一处理，这样玩家能看到收纳动画
        const allGone = st.screws.filter(s => !s.removed).length <= 1;
        if (!allGone) this._autoMatch();
      }
    } else {
      st.combo = 0;
      if (st.temp.length >= st.tempMax) {
        this.audio.play('lose');
        setTimeout(() => document.getElementById('ovLose').classList.remove('hidden'), 400);
        return;
      }
      st.temp.push({ color: c });
      this.audio.play('boxIn');
    }

    this._updatePanelPhysics(screw);
    this._checkPanels();
    if (st.screws.every(s => s.removed)) {
      setTimeout(() => this._autoClearTemp(), 280);
    }
  }

  // ★ 物理模拟 — 螺丝移除后木板绕支点旋转，重心下垂
  _updatePanelPhysics(screw) {
    const panel = this.st.panels.find(p => p.id === screw.panelId);
    if (!panel || panel.dropped) return;
    const remaining = panel.screws.filter(s => !s.removed);
    if (remaining.length === 1) {
      // 只剩一颗螺丝 → 支点，重心被重力拉下
      const sx = remaining[0].x, sy = remaining[0].y;
      const dx = panel.cx - sx, dy = panel.cy - sy; // 支点→重心向量
      const currentAngle = Math.atan2(dx, dy); // 支点到重心向量与垂直方向夹角
      panel._targetAngle = currentAngle * 0.55; // 重心被重力拉下木板的旋转角度
      panel._targetAngle = Math.max(-0.65, Math.min(0.65, panel._targetAngle));
      panel._pivotX = sx; panel._pivotY = sy;
      panel._targetOffX = 0; panel._targetOffY = 0;
      if (!panel._wasTilting) {
        this.audio.play('panelTilt');
        panel._wasTilting = true;
      }
    } else if (remaining.length >= 2) {
      panel._targetAngle = 0; panel._pivotX = null; panel._pivotY = null;
      panel._targetOffX = 0; panel._targetOffY = 0;
      panel._wasTilting = false;
    }
  }

  _autoMatch() {
    const st = this.st;
    if (!st.activeBox) return;
    for (let i = st.temp.length-1; i >= 0; i--) {
      if (st.temp[i].color.n === st.activeBox.n) {
        st.temp.splice(i, 1);
        st.activeCount++;
        this.audio.play('boxIn');
        if (st.activeCount >= st.cap) {
          this.audio.play('boxFull');
          this.ps.push(...burst(210,65,st.activeBox.g,14));
          st.activeBox = st.boxes.length>0 ? st.boxes.shift() : null;
          st.activeCount = 0;
          if (!st.activeBox) break;
        }
      }
    }
  }

  _autoClearTemp() {
    const st = this.st;
    if (st.temp.length === 0 && this._flyAuto.length === 0) {
      setTimeout(() => this._win(), 400);
      return;
    }
    this._autoClearing = true;

    const processNext = () => {
      // 等飞行螺丝完成
      if (this._flyAuto.length > 0) {
        setTimeout(processNext, 200);
        return;
      }
      // 没有暂存螺丝了 → 胜利
      if (st.temp.length === 0) {
        this._autoClearing = false;
        setTimeout(() => this._win(), 500);
        return;
      }

      // 确保有活跃盒子
      if (!st.activeBox && st.boxes.length > 0) {
        st.activeBox = st.boxes.shift();
        st.activeCount = 0;
      }
      if (!st.activeBox) {
        this._autoClearing = false;
        setTimeout(() => this._win(), 500);
        return;
      }

      // 找匹配的暂存螺丝
      let idx = -1;
      for (let i = st.temp.length-1; i >= 0; i--) {
        if (st.temp[i].color.n === st.activeBox.n) { idx = i; break; }
      }

      if (idx >= 0) {
        const c = st.temp[idx].color;
        const tx = (420 - st.tempMax * 44) / 2;
        const fromX = tx + idx * 44 + 19, fromY = 540;
        const toX = 196, toY = 80;

        this.audio.play('autoMatch');
        st.temp.splice(idx, 1);

        // 飞行螺丝 — 20帧≈333ms，快速流畅
        this._flyAuto.push({
          x: fromX, y: fromY, tx: toX, ty: toY,
          color: c, frame: 0, dur: 20,
        });

        setTimeout(() => {
          st.activeCount++;
          st.boxGlow = Date.now();
          this.ps.push(...burst(toX, toY, st.activeBox.g, 10));
          if (st.activeCount >= st.cap) {
            this.audio.play('boxFull');
            this.ps.push(...burst(210, 65, st.activeBox.g, 16));
            st.activeBox = st.boxes.length>0 ? st.boxes.shift() : null;
            st.activeCount = 0;
          }
          setTimeout(processNext, 200);
        }, 400);
      } else {
        // 不匹配 → 换下一个盒子
        if (st.boxes.length > 0) {
          const curBox = st.activeBox;
          st.activeBox = st.boxes.shift();
          st.activeCount = 0;
          st.boxes.push(curBox);
          setTimeout(processNext, 180);
        } else {
          // 还有螺丝但无可用盒子 → 失败（理论上不应该到这里）
          this._autoClearing = false;
          setTimeout(() => this._win(), 500);
        }
      }
    };
    processNext();
  }

  _checkPanels() {
    for (const p of this.st.panels) {
      if (p.dropped||p.dropStart) continue;
      const remain = p.screws.filter(s => !s.removed).length;
      if (remain === 0) {
        p.dropStart = Date.now(); p.dropAngle=0; p.dropOffY=0;
        p.dropPivotX=p.cx; p.dropPivotY=p.cy;
        this.audio.play('panelDrop');
        this.ps.push(...panelBurst(p));
        setTimeout(() => { p.dropped=true; }, 800);
      } else if (remain===1 && !p.wobble) {
        p.wobble = true;
        this.audio.play('panelWobble');
      }
    }
  }

  _win() {
    this.audio.play('win');
    const st=this.st;
    const undos=this.hist.length;
    let stars=3;
    if (undos>st.screws.length*0.35) stars=2;
    if (undos>st.screws.length*0.7) stars=1;
    document.getElementById('starsShow').textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars);
    document.getElementById('winMsg').textContent='第 '+st.level+' 关完成！撤销 '+undos+' 次';
    document.getElementById('ovWin').classList.remove('hidden');
    for (let i=0;i<40;i++){setTimeout(()=>{this.ps.push(...burst(60+Math.random()*300,100+Math.random()*400,COLS[Math.floor(Math.random()*6)].g,8));},i*30);}
  }

  undo() {
    if (this.busy||this.hist.length===0||this._autoClearing) return;
    const rec=this.hist.pop();
    const s=this.st.screws.find(s=>s.id===rec.sid);
    if (!s) return;
    s.removed=false; s.animPhase=null; s.flyStart=null; s.flyTarget=null; s.clickScale=1;
    this.st.activeBox=rec.box; this.st.activeCount=rec.cnt; this.st.boxes=rec.queue; this.st.temp=rec.temp;
    if (rec.panels) {
      for (const ps of rec.panels) {
        const p=this.st.panels.find(p=>p.id===ps.id);
        if (p) { p.dropped=ps.dropped; p.wobble=ps.wobble; p.dropStart=ps.dropStart; p.dropOffY=ps.dropOffY; p.dropAngle=ps.dropAngle;
          p._physAngle=ps._physAngle||0; p._pivotX=ps._pivotX; p._pivotY=ps._pivotY;
          p._targetAngle=ps._physAngle||0; p._targetOffX=0; p._targetOffY=0;
          if (ps._pivotX != null) { p._targetAngle = ps._physAngle||0; } }
      }
    }
    this.audio.play('click');
  }

  hint() {
    if (this.busy||!this.st||this._autoClearing) return;
    const st=this.st;
    let best=null;
    for (const s of st.screws) {
      if (s.removed) continue;
      const p=st.panels.find(p=>p.id===s.panelId);
      if (p&&!p.dropped&&this._blocked(p)) continue;
      if (st.activeBox&&s.color.n===st.activeBox.n) { best=s; break; }
      if (!best) best=s;
    }
    if (best) { this.hinted=best; this.audio.play('hint'); setTimeout(()=>{this.hinted=null;},2000); }
  }

  // ===== 动画 =====
  _animUn(screw, cb) {
    const dur=14, sx=screw.x, sy=screw.y; let f=0;
    const step=()=>{
      f++; screw.animPhase='unscrewing'; screw.animT=f/dur;
      screw.animX=sx; screw.animY=sy-35*screw.animT; screw.animR=screw.animT*Math.PI*2.5;
      if(f%3===0)this.ps.push(...sparks(screw.animX,screw.animY,screw.color.f,2));
      if(screw.clickScale&&screw.clickScale<1)screw.clickScale+=0.02;
      if(f>=dur){screw.animT=1;screw.clickScale=1;cb();}
      else requestAnimationFrame(step);
    }; step();
  }

  _animFly(screw, cb) {
    const dur=18, from=screw.flyStart, to=screw.flyTarget; let f=0;
    const step=()=>{
      f++; const t=f/dur, ease=1-Math.pow(1-t,3);
      screw.flyX=from.x+(to.x-from.x)*ease;
      screw.flyY=from.y+(to.y-from.y)*ease-Math.sin(t*Math.PI)*60;
      screw.flyScale=1-t*0.4; screw.flyR=t*Math.PI*1.5;
      if(f%2===0)this.ps.push({x:screw.flyX+(Math.random()-.5)*6,y:screw.flyY+(Math.random()-.5)*6,vx:(Math.random()-.5)*1,vy:(Math.random()-.5)*1,life:.6,decay:.05,size:1.5+Math.random()*2,color:screw.color.g});
      if(f>=dur){screw.flyX=to.x;screw.flyY=to.y;cb();}
      else requestAnimationFrame(step);
    }; step();
  }

  // ===== 渲染 =====
  _loop() { this._draw(); requestAnimationFrame(() => this._loop()); }

  _draw() {
    const ctx=this.ctx, W=this.W, H=this.H, S=this.S;
    ctx.clearRect(0,0,this.cvs.width,this.cvs.height);
    ctx.fillStyle='#12122a'; ctx.fillRect(0,0,this.cvs.width,this.cvs.height);
    ctx.strokeStyle='rgba(255,255,255,0.025)'; ctx.lineWidth=0.5;
    for(let x=0;x<W;x+=28){ctx.beginPath();ctx.moveTo(x*S,0);ctx.lineTo(x*S,H*S);ctx.stroke();}
    for(let y=0;y<H;y+=28){ctx.beginPath();ctx.moveTo(0,y*S);ctx.lineTo(W*S,y*S);ctx.stroke();}

    ctx.save(); ctx.scale(S,S);
    const st=this.st;
    if(!st){ctx.restore();return;}

    const GX=30,GY=130,GW=360,GH=340;

    let shakeX=0,shakeY=0;
    if(this.shakeStart){const el=Date.now()-this.shakeStart;if(el<this.shakeDur){const d=1-el/this.shakeDur;shakeX=(Math.random()-.5)*this.shakeX*d;shakeY=(Math.random()-.5)*this.shakeX*d;}else this.shakeX=0;}

    ctx.fillStyle=ctx.createRadialGradient(210,320,30,210,320,280);
    ctx.fillStyle; // 重置
    const bgG=ctx.createRadialGradient(210,320,30,210,320,280);
    bgG.addColorStop(0,'rgba(100,150,200,0.06)'); bgG.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=bgG; ctx.fillRect(GX,GY,GW,GH);

    this._drawDecorGear(ctx,55,155,22,0.03);
    this._drawDecorGear(ctx,370,310,28,0.025);
    this._drawDecorGear(ctx,355,145,18,0.02);

    ctx.fillStyle='rgba(255,255,255,0.025)'; rrect(ctx,GX+shakeX,GY+shakeY,GW,GH,16); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.06)'; ctx.lineWidth=1; rrect(ctx,GX+shakeX,GY+shakeY,GW,GH,16); ctx.stroke();

    const clipBottom=GY+GH;
    ctx.strokeStyle='rgba(255,255,255,0.06)'; ctx.beginPath(); ctx.moveTo(GX,clipBottom); ctx.lineTo(GX+GW,clipBottom); ctx.stroke();

    ctx.save(); ctx.translate(shakeX,shakeY);

    ctx.save(); ctx.beginPath(); ctx.rect(GX-40,GY-40,GW+80,GH+140); ctx.clip();

    const sortedPanels=[...st.panels].sort((a,b)=>a.layer-b.layer);

    // 标记每个面板是否被遮挡
    for(const p of sortedPanels){if(p.dropped)continue;p._blocked=this._blocked(p);}

    // ★ 单轮逐层渲染：螺丝绑定所在木板，不浮层
    // 最上层（未遮挡）→ 螺丝正常色；被遮挡层 → 螺丝半透明附在木板层序内
    for(const p of sortedPanels){
      if(p.dropped)continue;
      const eps=0.003;
      if(Math.abs(p._targetAngle-p._physAngle)<eps) p._physAngle=p._targetAngle;
      else p._physAngle+=(p._targetAngle-p._physAngle)*0.12;

      this._drawPanel(ctx, p, clipBottom);

      for(const s of p.screws){
        if(s.removed)continue;
        if(s.animPhase==='unscrewing'||s.animPhase==='flying')continue;
        const sc=(s.clickScale&&s.clickScale<1)?s.clickScale:1;

        if(!p._blocked){
          // 顶层：正常颜色螺丝
          this._drawScrew(ctx, s.x, s.y, s.color, s===this.hinted, 0, sc, false);
        } else {
          // 被遮挡层：半透明 ghost，画在此板层序内，上层板会自然遮盖
          ctx.save();
          ctx.globalAlpha = 0.28;
          this._drawScrewRaw(ctx, s.x, s.y, s.color);
          ctx.globalAlpha = 0.55;
          ctx.fillStyle = '#444'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText('🔒', s.x, s.y);
          ctx.restore();
        }
      }
    }

    // 飞行/拧动中的螺丝
    for(const s of st.screws){
      if(s.removed&&s.animPhase!=='flying')continue;
      let sx=s.x,sy=s.y,rot=0,sc=1;
      if(s.animPhase==='unscrewing'&&s.animT<1){sx=s.animX;sy=s.animY;rot=s.animR;sc=s.clickScale||1;}
      else if(s.animPhase==='flying'){sx=s.flyX;sy=s.flyY;rot=s.flyR;sc=s.flyScale;}
      else if(s.clickScale&&s.clickScale<1)sc=s.clickScale;
      this._drawScrew(ctx,sx,sy,s.color,s===this.hinted,rot,sc,false);
    }

    ctx.restore(); // 解除蒙版

    // 自动收纳飞行螺丝
    for(const fs of this._flyAuto){
      const t2=Math.min(fs.frame/fs.dur,1);
      const ease=1-Math.pow(1-t2,3), arc=Math.sin(t2*Math.PI)*70;
      const sx=fs.x+(fs.tx-fs.x)*ease, sy=fs.y+(fs.ty-fs.y)*ease-arc;
      const sc2=Math.max(0.7, 1-t2*0.3), rot2=t2*Math.PI*1.5;
      this._drawScrew(ctx,sx,sy,fs.color,false,rot2,sc2,false);
      if(fs.frame%2===0)this.ps.push({x:sx+(Math.random()-.5)*8,y:sy+(Math.random()-.5)*8,vx:(Math.random()-.5)*1.5,vy:(Math.random()-.5)*1.5,life:.6,decay:.05,size:2+Math.random()*3,color:fs.color.g});
    }

    const aliveFly=[];
    for(const fs of this._flyAuto){fs.frame++; if(fs.frame<fs.dur)aliveFly.push(fs);}
    this._flyAuto=aliveFly;

    for(const p of this.ps){ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);ctx.fill();}
    ctx.globalAlpha=1;
    ctx.restore();

    this._drawBoxes(ctx,st);
    this._drawTemp(ctx,st);

    if(this._autoClearing){
      const rem=st.temp.length+this._flyAuto.length;
      ctx.fillStyle='rgba(255,215,0,0.75)'; ctx.font='bold 14px "PingFang SC","Microsoft YaHei"'; ctx.textAlign='center';
      ctx.fillText('✨ 自动收纳中… 剩余 '+rem+' 颗', 210, 490);
    }

    if(st.combo&&st.combo>1){
      const alpha=Math.max(0,1-(Date.now()-st.comboTime)/1200);
      ctx.fillStyle='rgba(255,215,0,'+alpha+')'; ctx.font='bold 18px "PingFang SC","Microsoft YaHei"'; ctx.textAlign='center';
      ctx.fillText('🔥 连击 x'+st.combo, 210, 310);
    }

    ctx.restore();
    this.ps=this.ps.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life-=p.decay;return p.life>0;});
  }

  _drawPanel(ctx, p, clipBottom) {
    const R=14, x=p.cx-p.w/2, y=p.cy-p.h/2;
    const wood=p.wood||WOODS[0];
    let dropOffY=0, dropAngle=0;
    if(p.dropStart){
      const el=(Date.now()-p.dropStart)/1000;
      dropOffY=el*el*160; dropAngle=Math.sin(el*2.5)*0.35*Math.min(el*1.5,1);
      p.dropOffY=dropOffY; p.dropAngle=dropAngle;
      if(p.cy+dropOffY-p.h/2>clipBottom+80)return;
    }

    ctx.save();

    // ★ 物理倾斜 — 绕支点螺丝旋转，重心下坠
    if (p._pivotX != null) {
      const angle = p._physAngle || 0;
      if (Math.abs(angle) > 0.002) {
        ctx.translate(p._pivotX, p._pivotY);
        ctx.rotate(angle);
        ctx.translate(-p._pivotX, -p._pivotY);
      }
    }

    if(p.dropStart){ctx.translate(p.cx,p.cy);if(dropAngle)ctx.rotate(dropAngle);ctx.translate(0,dropOffY);ctx.translate(-p.cx,-p.cy);}

    // 面板阴影（随层级加深，高层更明显）
    const shadowAlpha = 0.15 + p.layer * 0.035;
    ctx.fillStyle = 'rgba(0,0,0,' + shadowAlpha.toFixed(2) + ')';
    if (p.shape === SHAPE_RECT) { rrect(ctx, x+5, y+5, p.w, p.h, R); ctx.fill(); }
    else { shapePath(ctx, p.cx+4, p.cy+5, p.w, p.h, p.shape); ctx.fill(); }

    // 额外柔光阴影（层次分离）
    ctx.fillStyle = 'rgba(0,0,0,' + (shadowAlpha*0.55).toFixed(2) + ')';
    if (p.shape === SHAPE_RECT) { rrect(ctx, x+1, y+1, p.w, p.h, R); ctx.fill(); }
    else { shapePath(ctx, p.cx+1, p.cy+2, p.w, p.h, p.shape); ctx.fill(); }

    // 木质填充
    const grad=ctx.createLinearGradient(x,y,x+p.w,y+p.h);
    grad.addColorStop(0,wood.light); grad.addColorStop(0.35,wood.base); grad.addColorStop(0.7,wood.base); grad.addColorStop(1,wood.dark);
    ctx.fillStyle=grad;
    if (p.shape === SHAPE_RECT) { rrect(ctx, x, y, p.w, p.h, R); }
    else { shapePath(ctx, p.cx, p.cy, p.w, p.h, p.shape); }
    ctx.fill();

    // 高光
    const hiG=ctx.createLinearGradient(x,y,x,y+p.h*0.45);
    hiG.addColorStop(0,'rgba(255,255,255,0.22)'); hiG.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=hiG;
    if (p.shape === SHAPE_RECT) { rrect(ctx, x+5, y+3, p.w-10, p.h*0.35, R-4); }
    else { ctx.save(); ctx.beginPath(); shapePath(ctx, p.cx, p.cy, p.w, p.h, p.shape); ctx.clip(); ctx.fillRect(x, y, p.w, p.h*0.35); ctx.restore(); }
    ctx.fill();

    // 边框（高层更粗更暗 → 层次分明）
    const borderAlpha = 0.10 + p.layer * 0.03;
    const borderW = 1.0 + p.layer * 0.25;
    ctx.strokeStyle = 'rgba(0,0,0,' + borderAlpha.toFixed(2) + ')';
    ctx.lineWidth = borderW;
    if (p.shape === SHAPE_RECT) { rrect(ctx, x, y, p.w, p.h, R); }
    else { shapePath(ctx, p.cx, p.cy, p.w, p.h, p.shape); }
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.08 + p.layer * 0.015).toFixed(2) + ')';
    ctx.lineWidth = 0.8;
    if (p.shape === SHAPE_RECT) { rrect(ctx, x+1.5, y+1.5, p.w-3, p.h-3, R-1); }
    else { shapePath(ctx, p.cx, p.cy, p.w-2, p.h-2, p.shape); }
    ctx.stroke();

    // 木纹（仅矩形有细腻纹理，其他形状简化）
    if (p.shape === SHAPE_RECT) {
      ctx.save(); ctx.beginPath(); rrect(ctx, x, y, p.w, p.h, R); ctx.clip();
      ctx.strokeStyle='rgba(0,0,0,0.04)'; ctx.lineWidth=0.6;
      for(let i=-p.h/2+p.h*0.15;i<p.h/2;i+=p.h*0.22){ctx.beginPath();ctx.moveTo(x+6,p.cy+i);ctx.quadraticCurveTo(p.cx,p.cy+i+1.5,x+p.w-6,p.cy+i);ctx.stroke();}
      ctx.fillStyle='rgba(0,0,0,0.04)'; ctx.beginPath(); ctx.ellipse(p.cx+p.w*0.25,p.cy+p.h*0.15,3,2,0.3,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(p.cx-p.w*0.2,p.cy-p.h*0.1,2.5,1.8,-0.2,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }

    // 螺丝孔标记
    for(const s of p.screws){
      if(s.removed)continue;
      ctx.fillStyle='rgba(0,0,0,0.07)'; ctx.beginPath(); ctx.arc(s.x,s.y,8,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.05)'; ctx.beginPath(); ctx.arc(s.x-0.5,s.y-1,3.5,0,Math.PI*2); ctx.fill();
    }

    ctx.restore();
  }

  _drawScrew(ctx, x, y, col, hint, rot, scale, blocked) {
    ctx.save(); ctx.translate(x,y);
    if(scale&&scale!==1)ctx.scale(scale,scale);
    if(rot)ctx.rotate(-rot);

    const r=12;

    if(hint){const pulse=Math.sin(Date.now()/150)*0.4+0.6;ctx.shadowColor=col.g;ctx.shadowBlur=34*pulse;}

    ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.arc(1.5,2,r,0,Math.PI*2); ctx.fill();

    ctx.beginPath();
    for(let i=0;i<6;i++){const a=Math.PI/6+i*Math.PI/3,nx=r*Math.cos(a),ny=r*Math.sin(a),a1=a-Math.PI/6,a2=a+Math.PI/6;if(i===0)ctx.moveTo(r*0.85*Math.cos(a1),r*0.85*Math.sin(a1));ctx.quadraticCurveTo(nx,ny,r*0.85*Math.cos(a2),r*0.85*Math.sin(a2));}
    ctx.closePath();

    const grad=ctx.createRadialGradient(-2,-2.5,r*0.05,1,1,r*1.2);
    grad.addColorStop(0,lighten(col.f,55)); grad.addColorStop(0.2,lighten(col.f,25));
    grad.addColorStop(0.5,col.f); grad.addColorStop(0.8,col.d); grad.addColorStop(1,'rgba(0,0,0,0.3)');
    ctx.fillStyle=grad; ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.18)'; ctx.lineWidth=0.6; ctx.stroke();

    ctx.beginPath(); ctx.arc(0,0,r*0.62,0,Math.PI*2);
    ctx.fillStyle='rgba(0,0,0,0.18)'; ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.12)'; ctx.lineWidth=0.5; ctx.stroke();

    const slotW=1.2,slotL=r*0.5;
    ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(-slotW,-slotL,slotW*2,slotL*2); ctx.fillRect(-slotL,-slotW,slotL*2,slotW*2);
    ctx.fillStyle='rgba(255,255,255,0.2)'; ctx.fillRect(-slotW,-slotL,0.6,slotL*2); ctx.fillRect(-slotL,-slotW,slotL*2,0.6);

    ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.beginPath(); ctx.ellipse(-r*0.25,-r*0.35,r*0.28,r*0.2,-0.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.1)'; ctx.beginPath(); ctx.ellipse(r*0.2,r*0.3,r*0.35,r*0.12,0.3,0,Math.PI*2); ctx.fill();

    if(hint){
      const hp=Math.sin(Date.now()/180)*0.35+0.65;
      ctx.strokeStyle='rgba(255,215,0,'+(0.4*hp)+')'; ctx.lineWidth=5; ctx.beginPath(); ctx.arc(0,0,r+8,0,Math.PI*2); ctx.stroke();
      ctx.strokeStyle='rgba(255,255,255,'+(0.5+Math.sin(Date.now()/180)*0.3)+')'; ctx.lineWidth=3;
      ctx.setLineDash([4,4]); ctx.lineDashOffset=-Date.now()/60; ctx.beginPath(); ctx.arc(0,0,r+4,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
    }

    ctx.restore();
  }

  // 纯螺丝绘制（无 save/restore/hint，供 ghost 层使用）
  _drawScrewRaw(ctx, x, y, col) {
    ctx.translate(x, y);
    const r = 12;
    ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.arc(1.5,2,r,0,Math.PI*2); ctx.fill();
    ctx.beginPath();
    for(let i=0;i<6;i++){const a=Math.PI/6+i*Math.PI/3,nx=r*Math.cos(a),ny=r*Math.sin(a),a1=a-Math.PI/6,a2=a+Math.PI/6;if(i===0)ctx.moveTo(r*0.85*Math.cos(a1),r*0.85*Math.sin(a1));ctx.quadraticCurveTo(nx,ny,r*0.85*Math.cos(a2),r*0.85*Math.sin(a2));}
    ctx.closePath();
    const grad=ctx.createRadialGradient(-2,-2.5,r*0.05,1,1,r*1.2);
    grad.addColorStop(0,lighten(col.f,55)); grad.addColorStop(0.2,lighten(col.f,25));
    grad.addColorStop(0.5,col.f); grad.addColorStop(0.8,col.d); grad.addColorStop(1,'rgba(0,0,0,0.3)');
    ctx.fillStyle=grad; ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.18)'; ctx.lineWidth=0.6; ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,r*0.62,0,Math.PI*2);
    ctx.fillStyle='rgba(0,0,0,0.18)'; ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.12)'; ctx.lineWidth=0.5; ctx.stroke();
    const slotW=1.2,slotL=r*0.5;
    ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(-slotW,-slotL,slotW*2,slotL*2); ctx.fillRect(-slotL,-slotW,slotL*2,slotW*2);
    ctx.fillStyle='rgba(255,255,255,0.2)'; ctx.fillRect(-slotW,-slotL,0.6,slotL*2); ctx.fillRect(-slotL,-slotW,slotL*2,0.6);
    ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.beginPath(); ctx.ellipse(-r*0.25,-r*0.35,r*0.28,r*0.2,-0.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.1)'; ctx.beginPath(); ctx.ellipse(r*0.2,r*0.3,r*0.35,r*0.12,0.3,0,Math.PI*2); ctx.fill();
    ctx.translate(-x, -y);
  }

  _drawBoxes(ctx, st) {
    if(!st.activeBox)return;
    const Y=62,BW=52,BH=36;
    ctx.fillStyle='rgba(0,0,0,0.35)'; rrect(ctx,24,Y-6,372,BH+16,12); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.55)'; ctx.font='10px "PingFang SC","Microsoft YaHei"'; ctx.textAlign='center'; ctx.fillText('当前收纳盒',210,Y-2);
    const bx=175,by=Y+6;
    let glowExtra=0; if(st.boxGlow){const el=Date.now()-st.boxGlow; if(el<400)glowExtra=(1-el/400)*16;}
    ctx.fillStyle='rgba(255,255,255,0.12)'; rrect(ctx,bx-2,by-2,BW+4,BH+4,9); ctx.fill();
    ctx.strokeStyle=st.activeBox.g; ctx.lineWidth=2; ctx.shadowColor=st.activeBox.g; ctx.shadowBlur=8+glowExtra;
    rrect(ctx,bx-2,by-2,BW+4,BH+4,9); ctx.stroke(); ctx.shadowBlur=0;
    const g2=ctx.createLinearGradient(bx,by,bx,by+BH); g2.addColorStop(0,st.activeBox.f); g2.addColorStop(1,st.activeBox.d);
    ctx.fillStyle=g2; rrect(ctx,bx,by,BW,BH,7); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.28)'; ctx.lineWidth=1; rrect(ctx,bx,by,BW,BH,7); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='bold 14px "PingFang SC","Microsoft YaHei"'; ctx.fillText(st.activeCount+'/'+st.cap,bx+BW/2,by+BH/2+5);
    if(st.boxes.length>0){const nx=254,ny=by; ctx.fillStyle=st.boxes[0].f; rrect(ctx,nx,ny+2,26,BH-4,6); ctx.fill(); ctx.fillStyle='rgba(255,255,255,0.45)'; ctx.font='9px "PingFang SC","Microsoft YaHei"'; ctx.fillText('下一个',nx+13,ny-8); if(st.boxes.length>1)ctx.fillText('+'+String(st.boxes.length-1),nx+42,ny+BH/2+4);}
  }

  _drawTemp(ctx, st) {
    const tx=(420-st.tempMax*44)/2,ty=520;
    for(let i=0;i<st.tempMax;i++){
      const x=tx+i*44,y=ty;
      if(i<st.temp.length){const c=st.temp[i].color; ctx.fillStyle=c.f; rrect(ctx,x,y,38,38,9); ctx.fill(); ctx.strokeStyle=c.g; ctx.lineWidth=1.5; rrect(ctx,x,y,38,38,9); ctx.stroke();}
      else{ctx.strokeStyle='rgba(255,255,255,0.18)'; ctx.lineWidth=1.5; ctx.setLineDash([4,3]); rrect(ctx,x,y,38,38,9); ctx.stroke(); ctx.setLineDash([]);}
    }
    ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.font='10px "PingFang SC","Microsoft YaHei"'; ctx.textAlign='center'; ctx.fillText('临时存放 ('+st.temp.length+'/'+st.tempMax+')',210,ty-8);
  }

  _drawDecorGear(ctx, cx, cy, r, alpha) {
    ctx.save(); ctx.globalAlpha=alpha; ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=0.8;
    const teeth=8, ir=r*0.55; ctx.beginPath();
    for(let i=0;i<teeth*2;i++){const a=i*Math.PI/teeth-Math.PI/2,cr=i%2===0?r:ir,px=cx+cr*Math.cos(a),py=cy+cr*Math.sin(a); if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}
    ctx.closePath(); ctx.stroke(); ctx.beginPath(); ctx.arc(cx,cy,ir*0.3,0,Math.PI*2); ctx.fill(); ctx.restore();
  }
}

// ===== 辅助 =====
function rrect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function lighten(hex,pct){const n=parseInt(hex.replace('#',''),16),a=Math.round(2.55*pct);return 'rgb('+Math.min(255,(n>>16)+a)+','+Math.min(255,(n>>8&0xFF)+a)+','+Math.min(255,(n&0xFF)+a)+')';}
function sparks(x,y,color,n){const a=[];for(let i=0;i<n;i++){const ang=Math.random()*Math.PI*2,spd=1+Math.random()*3;a.push({x,y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,life:1,decay:.025+Math.random()*.04,size:1.5+Math.random()*2.5,color});}return a;}
function burst(x,y,color,n){const a=[];for(let i=0;i<n;i++){const ang=Math.random()*Math.PI*2,spd=2+Math.random()*5;a.push({x,y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-1.5,life:1,decay:.018+Math.random()*.03,size:2+Math.random()*4,color});}return a;}
function panelBurst(p){const a=[];for(let i=0;i<18;i++){a.push({x:p.cx+(Math.random()-.5)*p.w,y:p.cy+(Math.random()-.5)*p.h,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5+2,life:1,decay:.014+Math.random()*.025,size:2.5+Math.random()*4.5,color:p.wood?p.wood.base:p.color});}return a;}
function hideAll(){['ovStart','ovWin','ovLose','ovPause'].forEach(id=>document.getElementById(id).classList.add('hidden'));}

const G = new Game();
</script>
